<head>

  <style>
#splash{position:fixed;inset:0;z-index:9999;overflow:hidden;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 42%,#7a1424 0%,#4a0b16 45%,#1c0609 100%);color:#f3cd62;font-family:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;transition:opacity .6s ease,transform .7s cubic-bezier(.5,0,.3,1),filter .7s}
#splash.out{opacity:0;transform:scale(1.18);filter:blur(6px);pointer-events:none}
.sp-rays{position:absolute;left:50%;top:44%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(from 0deg,rgba(255,210,122,.09) 0 6deg,transparent 6deg 22.5deg);-webkit-mask:radial-gradient(closest-side,#000 0,#000 10%,transparent 40%);mask:radial-gradient(closest-side,#000 0,#000 10%,transparent 40%);opacity:0;animation:sp-fade 1.2s .2s ease forwards,sp-spin 40s linear infinite}
.sp-glow{position:absolute;left:50%;top:42%;width:90vmin;height:90vmin;margin:-45vmin 0 0 -45vmin;border-radius:50%;background:radial-gradient(closest-side,rgba(255,207,110,.5),rgba(255,207,110,0));opacity:0;animation:sp-glow 2.4s .55s ease-out forwards}
.sp-dust i{position:absolute;bottom:-4vh;left:var(--x);width:calc(5px*var(--s));height:calc(5px*var(--s));border-radius:50%;background:#ffd98a;box-shadow:0 0 8px #ffbf4a;opacity:0;animation:sp-dust 4.2s var(--d) linear infinite}
.sp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:1.2vh;animation:sp-shake .32s .62s both}
.sp-emblem{position:relative;height:clamp(130px,42vh,340px);aspect-ratio:724/900}.sp-emblem svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;will-change:transform,opacity}.sp-emblem .sp-defs{width:0;height:0}
.sp-sw{transform-origin:50% 45.6%;opacity:0}
.sp-swl{animation:sp-swl .6s .1s cubic-bezier(.3,1.5,.55,1) forwards}
.sp-swr{animation:sp-swr .6s .1s cubic-bezier(.3,1.5,.55,1) forwards}
.sp-spark{transform-origin:50% 36.1%;opacity:0;animation:sp-spark .55s .6s ease-out forwards}
.sp-king{transform-origin:50% 88.9%;opacity:0;animation:sp-king .7s .7s cubic-bezier(.25,1.6,.5,1) forwards}
.sp-shine{animation:sp-shine 1.6s 1.45s ease-in-out infinite}
.sp-text{display:flex;flex-direction:column;align-items:center;gap:.4vh}
.sp-title{margin:0;font-weight:700;font-size:clamp(24px,7.4vh,56px);letter-spacing:.14em;line-height:1;white-space:nowrap;filter:drop-shadow(0 3px 0 #3a0a10) drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.sp-title span{display:inline-block;background:linear-gradient(180deg,#fff4c2 0%,#f3cd62 45%,#c38a22 75%,#8a5a14 100%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transform:translateY(.5em) scale(.6);animation:sp-letter .5s calc(1.15s + var(--i)*.045s) cubic-bezier(.3,1.6,.5,1) forwards}
.sp-ar{margin:0;font-size:clamp(16px,4.6vh,32px);font-weight:500;color:#ffe9b0;opacity:0;letter-spacing:.02em;text-shadow:0 2px 10px rgba(0,0,0,.6);animation:sp-up .6s 1.75s ease-out forwards}
.sp-games{display:flex;gap:clamp(10px,2.6vh,20px);margin-top:1vh}
.sp-games svg{width:clamp(22px,6vh,40px);height:clamp(22px,6vh,40px);padding:5px;border-radius:50%;background:rgba(40,6,12,.55);box-shadow:inset 0 0 0 1.5px rgba(243,205,98,.5),0 4px 10px rgba(0,0,0,.4);opacity:0;transform:scale(.3);animation:sp-pop .45s cubic-bezier(.3,1.8,.5,1) forwards}
.sp-games svg:nth-child(1){animation-delay:2s}.sp-games svg:nth-child(2){animation-delay:2.1s}.sp-games svg:nth-child(3){animation-delay:2.2s}.sp-games svg:nth-child(4){animation-delay:2.3s}
.sp-bar{position:absolute;bottom:max(6vh,calc(env(safe-area-inset-bottom) + 18px));left:50%;width:min(46vw,260px);height:4px;margin-left:min(-23vw,-130px);border-radius:4px;background:rgba(255,233,168,.14);overflow:hidden;opacity:0;animation:sp-fade .5s .9s forwards}
.sp-bar i{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(var(--p,0));background:linear-gradient(90deg,#c38a22,#ffe9a8,#f3cd62);box-shadow:0 0 10px #ffcf6e;transition:transform .5s ease}
@keyframes sp-fade{to{opacity:1}}
@keyframes sp-spin{to{transform:rotate(360deg)}}
@keyframes sp-glow{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}100%{opacity:.75;transform:scale(1)}}
@keyframes sp-dust{0%{opacity:0;transform:translateY(0)}15%{opacity:.8}100%{opacity:0;transform:translateY(-90vh) translateX(4vw)}}
@keyframes sp-swl{0%{opacity:0;transform:translate(-47%,13%) rotate(-70deg)}40%{opacity:1}100%{opacity:1;transform:none}}
@keyframes sp-swr{0%{opacity:0;transform:translate(47%,13%) rotate(70deg)}40%{opacity:1}100%{opacity:1;transform:none}}
@keyframes sp-spark{0%{opacity:0;transform:scale(.2) rotate(0)}30%{opacity:1;transform:scale(1.25) rotate(20deg)}100%{opacity:0;transform:scale(1.6) rotate(45deg)}}
@keyframes sp-king{0%{opacity:0;transform:translateY(13%) scale(.7)}100%{opacity:1;transform:none}}
@keyframes sp-shine{0%{transform:skewX(-18deg) translateX(-200px)}55%,100%{transform:skewX(-18deg) translateX(620px)}}
@keyframes sp-letter{to{opacity:1;transform:none}}
@keyframes sp-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sp-pop{to{opacity:1;transform:none}}
@keyframes sp-shake{0%,100%{transform:none}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>

<script>
// The splash: shown at once (before the game's code loads), gone once the café is drawn and the animation has played.
(function () {
  var el = document.getElementById('splash'), bar = el.querySelector('.sp-bar i');
  var waits = [], ready = false, done = false, opened = false, t0 = Date.now(), MIN = 2900;
  var skip = navigator.webdriver && !/[?&]splash\b/.test(location.search);   // automated tests go straight in
  function finish() {
    if (done) return; done = true;
    bar.style.setProperty('--p', 1);
    setTimeout(function () {
      el.classList.add('out'); opened = true;
      waits.forEach(function (f) { f(); }); waits = [];   // the café scene starts as the splash opens onto it
      setTimeout(function () { el.remove(); }, skip ? 0 : 700);
    }, skip ? 0 : 250);
  }
  function check() { if (ready && (skip || Date.now() - t0 >= MIN)) finish(); }
  // loading progress: creeps toward 90% until the game says it's ready
  var p = 0, tick = setInterval(function () { if (done) return clearInterval(tick); p += (0.9 - p) * 0.06; bar.style.setProperty('--p', p.toFixed(3)); check(); }, 100);
  window.__splash = {
    ready: function () { ready = true; check(); },
    then: function (f) { if (opened) f(); else waits.push(f); },
  };
  setTimeout(function () { ready = true; check(); }, 15000);   // never stuck on the splash
  if (skip) { el.style.display = 'none'; }
})();
</script>
