<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}
.p{width:1080px;height:1080px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 44%,#a02236 0,#5e0e1d 45%,#2b060d 80%,#16040a 100%)}
.rays{position:absolute;inset:-600px;background:repeating-conic-gradient(from 3deg at 50% 50%,rgba(243,205,98,.08) 0 5deg,transparent 5deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 0,#000 15%,transparent 42%)}
.lattice{position:absolute;inset:0;opacity:.05;background:conic-gradient(from 45deg,#f3cd62 25%,transparent 0 50%,#f3cd62 0 75%,transparent 0) 0 0/56px 56px}
img{position:absolute;left:50%;top:50%;height:800px;transform:translate(-50%,-50%);margin-top:6px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
</style></head><body><div class="p"><div class="lattice"></div><div class="rays"></div><img src="emblem-crop.png"></div></body></html>
