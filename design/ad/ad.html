<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Poppins:wght@700;800;900&display=block" rel="stylesheet">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;overflow:hidden;background:#12070a}
  .abs{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform,opacity}
  .txt{color:#fff;font-weight:900;text-align:center;white-space:nowrap;text-shadow:0 6px 24px rgba(0,0,0,.65)}
  .ar{font-family:Cairo,sans-serif;direction:rtl}
  .en{font-family:Poppins,sans-serif}
  .gold{color:#f3cd62}
  .pill{background:#f3cd62;color:#22120a;border-radius:999px;font-weight:900;text-align:center;box-shadow:0 10px 40px rgba(243,205,98,.45)}
  .phone{background:#0d0b0a;border-radius:7%/12%;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 3px #2b2522 inset;overflow:hidden}
  .phone img{position:absolute;inset:3.2% 2.4%;width:95.2%;height:93.6%;object-fit:cover;border-radius:4%/7%}
  .face{border-radius:50%;overflow:hidden;border:6px solid #f3cd62;box-shadow:0 14px 40px rgba(0,0,0,.6);background:#3a2a20}
  .face img{width:100%;height:120%;object-fit:cover;object-position:50% 15%}
</style></head>
<body><div id="stage"></div>
<script>
// The advert: a short café story, then the game revealed at the end. render(t) draws the frame at t seconds;
// render.mjs steps it frame by frame and records each one. W, H and LANG come from the page address.
const P = new URLSearchParams(location.search);
const W = +P.get('w') || 1080, H = +P.get('h') || 1920, LANG = P.get('lang') || 'ar';
const AR = LANG === 'ar';
const S = Math.min(W, H);              // the size everything is measured in
const V = H > W;                       // vertical (9:16) or landscape (16:9)
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const A = 'assets/';
const T = {
  s1: AR ? 'كل ليلة على القهوة…' : 'Every night at the café…',
  s2: AR ? 'الكل مستني اللي يغلبه' : "Everyone's waiting for a challenger",
  slam: AR ? 'طاخ!' : 'SLAM!', dush: AR ? 'دُش!' : 'DOUBLE SIX!', mate: AR ? 'كش مات!' : 'CHECKMATE!', home: AR ? 'على البيت!' : 'HOME RUN!',
  coins: AR ? 'كوينز كل يوم' : 'Coins every day', tour: AR ? 'وبطولة كل خميس' : 'A tournament every Thursday',
  reveal: AR ? 'ودلوقتي القهوة في جيبك' : 'Now the café fits in your pocket',
  name: AR ? 'بورد باتلز' : 'Board Battles', play: AR ? 'العب ببلاش دلوقتي' : 'Play free now',
  games: AR ? 'دومينو · طاولة · شطرنج · لودو' : 'Dominoes · Backgammon · Chess · Ludo',
  online: AR ? 'العب مع صحابك ومع ناس من كل مصر' : 'Play friends and players all over Egypt',
};
const font = AR ? 'ar' : 'en';

/* ---------- little helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const inout = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
function el(html, cls = '') { const d = document.createElement('div'); d.className = 'abs ' + cls; d.innerHTML = html; stage.appendChild(d); return d; }
function img(src, cls = '') { return el(`<img src="${A + src}" style="width:100%;height:100%;display:block">`, cls); }
/** Place an element: centre (x, y) in px, size (w, h), scale, rotation (deg), opacity. */
function put(e, x, y, w, h, s = 1, r = 0, o = 1) {
  e.style.width = w + 'px'; e.style.height = h + 'px';
  e.style.transform = `translate(${x - w / 2}px,${y - h / 2}px) rotate(${r}deg) scale(${s})`;
  e.style.opacity = o; e.style.display = o <= 0.001 ? 'none' : 'block';
}
/** A line of text, made smaller if it would be wider than the screen (English lines run longer). */
function text(str, size, cls = '') {
  const e = el('', `txt ${font} ${cls}`); e.textContent = str; e.style.fontSize = size + 'px'; e.style.lineHeight = '1.15';
  e.dataset.size = size;
  return e;
}
function refit() {
  for (const e of stage.querySelectorAll('.txt')) {
    if (!e.textContent) continue;
    const d = e.style.display, w = e.style.width, tf = e.style.transform;
    e.style.display = 'inline-block'; e.style.width = 'auto'; e.style.transform = 'none';
    for (let s = +e.dataset.size; s > 12 && e.scrollWidth > W * 0.92; s *= 0.95) e.style.fontSize = s + 'px';
    e.style.display = d; e.style.width = w; e.style.transform = tf;
  }
}
const CX = W / 2, CY = H / 2;
const lerp = (a, b, k) => a + (b - a) * k;
// a deterministic "random" (the same every frame)
const rnd = i => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };

/* ---------- drawn pieces (SVG) ---------- */
const PIP = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#1d120c"/>`;
let gid = 0;
function tileSvg(a, b) {   // an upright domino tile, a on top, b below (pips in the game's 2-column layout)
  const id = 'iv' + (gid++);
  const pos = { 1: [[50, 50]], 2: [[30, 30], [70, 70]], 3: [[30, 30], [50, 50], [70, 70]], 4: [[30, 30], [70, 30], [30, 70], [70, 70]],
    5: [[30, 30], [70, 30], [50, 50], [30, 70], [70, 70]], 6: [[32, 25], [68, 25], [32, 50], [68, 50], [32, 75], [68, 75]], 0: [] };
  const half = (n, oy) => pos[n].map(([x, y]) => PIP(x, oy + y * 0.9 + 5, 8.5)).join('');
  return `<svg viewBox="0 0 100 200" width="100%" height="100%"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#e6d6b4"/></linearGradient></defs>
    <rect x="3" y="3" width="94" height="194" rx="14" fill="url(#${id})" stroke="#2e1a10" stroke-width="4"/><path d="M14 100 H86" stroke="#b9852a" stroke-width="4"/><circle cx="50" cy="100" r="5" fill="#f3cd62" stroke="#2e1a10" stroke-width="2"/>
    ${half(a, 0)}${half(b, 100)}</svg>`;
}
function dieSvg(n, face = '#fdf6ea', pip = '#9c1222') {
  const p = { 1: [[50, 50]], 2: [[28, 28], [72, 72]], 3: [[28, 28], [50, 50], [72, 72]], 4: [[28, 28], [72, 28], [28, 72], [72, 72]], 5: [[28, 28], [72, 28], [50, 50], [28, 72], [72, 72]], 6: [[28, 25], [72, 25], [28, 50], [72, 50], [28, 75], [72, 75]] }[n];
  return `<svg viewBox="0 0 100 100" width="100%" height="100%"><rect x="4" y="4" width="92" height="92" rx="18" fill="${face}" stroke="#2e1a10" stroke-width="4"/>${p.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="9" fill="${pip}"/>`).join('')}</svg>`;
}
const knightSvg = `<svg viewBox="0 0 100 120" width="100%" height="100%"><path d="M22 112 H82 L78 96 H26 Z M30 94 C30 74 44 66 46 54 C38 58 30 58 24 50 C30 40 40 26 52 18 L54 8 L62 16 C76 22 84 40 82 60 C80 76 72 84 72 94 Z" fill="#fdf6ea" stroke="#2e1a10" stroke-width="4" stroke-linejoin="round"/><circle cx="56" cy="32" r="4" fill="#2e1a10"/></svg>`;
const pawnSvg = c => `<svg viewBox="0 0 100 120" width="100%" height="100%"><path d="M50 8 a18 18 0 1 1 -0.1 0 Z" fill="${c}" stroke="#2e1a10" stroke-width="4"/><path d="M36 46 Q50 56 64 46 L74 100 H26 Z" fill="${c}" stroke="#2e1a10" stroke-width="4" stroke-linejoin="round"/><rect x="18" y="98" width="64" height="14" rx="7" fill="${c}" stroke="#2e1a10" stroke-width="4"/></svg>`;
const glassSvg = `<svg viewBox="0 0 100 140" width="100%" height="100%"><ellipse cx="50" cy="130" rx="46" ry="9" fill="#e9dcc4" stroke="#2e1a10" stroke-width="3"/>
  <path d="M24 20 H76 L68 118 Q67 126 58 126 H42 Q33 126 32 118 Z" fill="rgba(255,255,255,.28)" stroke="rgba(255,255,255,.75)" stroke-width="3"/>
  <path d="M27 48 H73 L68 118 Q67 124 58 124 H42 Q33 124 32 118 Z" fill="#b84a10"/><path d="M33 52 V110" stroke="rgba(255,255,255,.55)" stroke-width="4" stroke-linecap="round"/>
  <path d="M60 10 L50 70" stroke="#c9a24a" stroke-width="4" stroke-linecap="round"/></svg>`;
const lanternSvg = `<svg viewBox="0 0 100 200" width="100%" height="100%"><path d="M50 0 V28" stroke="#c9a24a" stroke-width="3"/><path d="M38 28 H62 L70 44 H30 Z" fill="#c9a24a"/>
  <path d="M30 44 H70 L80 120 L50 160 L20 120 Z" fill="#ffcf6b" stroke="#8a5a12" stroke-width="4"/><path d="M50 44 V160 M30 44 L50 160 M70 44 L50 160 M24 96 H76" stroke="#8a5a12" stroke-width="3" fill="none"/>
  <path d="M40 160 H60 L56 176 H44 Z" fill="#c9a24a"/><circle cx="50" cy="184" r="6" fill="#c9a24a"/></svg>`;
const rays = (c1, c2, n = 18) => `<svg viewBox="-100 -100 200 200" width="100%" height="100%">${Array.from({ length: n }, (_, i) => { const a = i / n * Math.PI * 2, b = a + Math.PI / n; return `<path d="M0 0 L${Math.cos(a) * 150} ${Math.sin(a) * 150} L${Math.cos(b) * 150} ${Math.sin(b) * 150} Z" fill="${i % 2 ? c1 : c2}"/>`; }).join('')}</svg>`;

/* ---------- the pieces of each scene ---------- */
// backgrounds
const bgNight = el('', ''); bgNight.style.background = 'radial-gradient(ellipse at 50% 30%, #3a1430 0%, #1a0b1e 45%, #07040c 100%)';
const stars = Array.from({ length: 40 }, (_, i) => { const s = el('', ''); s.style.background = '#fff'; s.style.borderRadius = '50%'; return s; });
const bgWarm = el('', ''); bgWarm.style.background = 'radial-gradient(circle at 50% 45%, #8a1a2c 0%, #4a0b16 55%, #1c0609 100%)';
const burst = el(rays('#5a0f1c', '#7a1424'), '');
const flash = el('', ''); flash.style.background = '#fff6d8';
const wood = el('', ''); wood.style.background = 'linear-gradient(180deg,#5a3418 0%,#3d2210 100%)'; wood.style.boxShadow = '0 -20px 60px rgba(0,0,0,.6)';
const woodLine = el('', ''); woodLine.style.background = 'repeating-linear-gradient(90deg, rgba(0,0,0,.0) 0 120px, rgba(0,0,0,.18) 120px 124px)';
// scene 1: lantern, tea, tiles on the table
const lantern = el(lanternSvg); const glow = el('', ''); glow.style.background = 'radial-gradient(circle, rgba(255,200,90,.55), rgba(255,200,90,0) 70%)';
const glass = el(glassSvg);
const steam = [0, 1, 2].map(() => { const s = el('', ''); s.style.background = 'radial-gradient(circle, rgba(255,255,255,.35), rgba(255,255,255,0) 70%)'; s.style.borderRadius = '50%'; return s; });
const tableTiles = [[6, 6], [5, 3], [2, 4]].map(([a, b]) => el(tileSvg(a, b)));
const t1 = text(T.s1, S * (V ? 0.1 : 0.085));
// scene 2: the regulars
const faces = ['AmFathi', 'HajjMahmoud', 'Mona'].map(n => el(`<img src="${A}${n}.png">`, 'face'));
const bubbles = ['emoji-hi', 'emoji-fire', 'emoji-wow'].map(n => img(n + '.png'));
const t2 = text(T.s2, S * (V ? 0.085 : 0.07));
const bigHi = img('emoji-hi.png');
// scene 3: the battle beats
const bigTile = el(tileSvg(6, 6));
const dice = [el(dieSvg(6)), el(dieSvg(6))];
const knight = el(knightSvg);
const board = el(`<svg viewBox="0 0 8 8" width="100%" height="100%">${Array.from({ length: 64 }, (_, i) => `<rect x="${i % 8}" y="${i >> 3}" width="1" height="1" fill="${(i % 8 + (i >> 3)) % 2 ? '#6b3f1e' : '#e8cf9c'}"/>`).join('')}</svg>`);
board.style.boxShadow = '0 20px 60px rgba(0,0,0,.6)'; board.style.border = `${S * 0.012}px solid #3d2210`;
const pawns = ['#e53935', '#1e88e5', '#43a047', '#fdd835'].map(c => el(pawnSvg(c)));
const boom = text('', S * 0.15, 'gold');
const sparks = Array.from({ length: 14 }, () => img('Spark2.png'));
// scene 4: coins and the tournament
const coins = Array.from({ length: 46 }, () => img('coin.png'));
const cup = img('cup.png'); cup.style.filter = 'drop-shadow(0 0 30px rgba(243,205,98,.8))';
const cupGlow = el('', ''); cupGlow.style.background = 'radial-gradient(circle, rgba(243,205,98,.6), rgba(243,205,98,0) 70%)';
const t4a = text(T.coins, S * 0.08); const t4b = text(T.tour, S * 0.07, 'gold');
const counter = text('', S * 0.16, 'gold'); counter.style.fontFamily = 'Poppins,sans-serif';
// scene 5: the reveal, with the real game
const t5 = text(T.reveal, S * (V ? 0.085 : 0.075));
const phone = el('<img id="screen" src="">', 'phone');
const screen = phone.querySelector('#screen');
const chips = ['emoji-lol', 'emoji-love', 'emoji-clap', 'emoji-gg'].map(n => img(n + '.png'));
const t5b = text(T.online, S * (V ? 0.055 : 0.05), 'gold');
// three more games on cards under the phone (vertical) or beside it (landscape)
const cards = [0, 1, 2].map(i => { const e = el('<img style="width:100%;height:100%;object-fit:cover;display:block">', 'phone'); e.style.borderRadius = '18px'; return e; });
window.CARDS = window.CARDS || [];
// scene 6: the end card (the game's crest, built like its splash)
const crest = ['Shield', 'DominoLayer', 'DieLayer', 'Spark2', 'Crown', 'Ribbon'].map(n => img(n + '.png'));
const PIV = { Shield: [.5, .5], DominoLayer: [.4, .46], DieLayer: [.62, .42], Spark2: [.5, 1 - 380 / 700], Crown: [.5, 1 - 100 / 700], Ribbon: [.5, 1 - 590 / 700] };
crest.forEach((c, i) => { const p = PIV[['Shield', 'DominoLayer', 'DieLayer', 'Spark2', 'Crown', 'Ribbon'][i]]; c.style.transformOrigin = `${p[0] * 100}% ${p[1] * 100}%`; });
const endRays = el(rays('rgba(243,205,98,.10)', 'rgba(243,205,98,0)', 24));
const t6a = text(T.play, S * 0.065); const playBtn = el('', 'pill ' + font);
const t6b = text(T.games, S * 0.042); t6b.style.color = '#ffe9b0';
const t6c = text('Free on Google Play  ·  Qimma Labs', S * 0.03); t6c.style.color = 'rgba(255,233,176,.75)'; t6c.style.fontFamily = 'Poppins,sans-serif';

/* ---------- the gameplay frames (filled in by render.mjs) ---------- */
window.CLIPS = window.CLIPS || [];   // [{ from, to, files: [...] , fps }]
function frameAt(t) {
  for (const c of window.CLIPS) if (t >= c.from && t < c.to) { const i = Math.min(c.files.length - 1, Math.floor((t - c.from) * c.fps)); return c.files[i]; }
  return null;
}

/* ---------- the timeline ---------- */
const D = 30;   // seconds
function hideAll() { for (const c of stage.children) { c.style.display = 'none'; } }

window.render = function (t) {
  hideAll();
  const shake = (amp, at, dur) => { const k = seg(t, at, at + dur); return k > 0 && k < 1 ? [Math.sin(t * 90) * amp * (1 - k), Math.cos(t * 77) * amp * (1 - k)] : [0, 0]; };

  /* 1. night at the café (0 – 4) */
  if (t < 4.4) {
    const fade = 1 - seg(t, 4.0, 4.4);
    put(bgNight, CX, CY, W, H, 1, 0, 1);
    stars.forEach((s, i) => { const z = S * (0.004 + rnd(i) * 0.006); put(s, rnd(i + 9) * W, rnd(i + 3) * H * 0.55, z, z, 1, 0, (0.3 + 0.7 * Math.abs(Math.sin(t * (1 + rnd(i) * 2) + i))) * fade); });
    const sw = Math.sin(t * 1.6) * 6;
    put(glow, CX, H * 0.2, S * 0.7, S * 0.7, 1, 0, 0.85 * fade);
    lantern.style.transformOrigin = '50% 0%';
    put(lantern, CX, H * 0.17, S * 0.16, S * 0.32, 1, sw, fade);
    put(wood, CX, H * 0.86, W, H * 0.34, 1, 0, fade); put(woodLine, CX, H * 0.86, W, H * 0.34, 1, 0, fade * 0.8);
    const zoom = 1 + t * 0.03;
    put(glass, CX + S * 0.18, H * 0.74, S * 0.22 * zoom, S * 0.31 * zoom, 1, 0, fade * ease(seg(t, 0.2, 1.0)));
    steam.forEach((s, i) => { const k = ((t * 0.5 + i / 3) % 1); put(s, CX + S * 0.18 + Math.sin(t * 2 + i) * S * 0.03, H * 0.66 - k * S * 0.28, S * 0.12 * (0.6 + k), S * 0.12 * (0.6 + k), 1, 0, (1 - k) * 0.8 * fade * seg(t, 0.6, 1.4)); });
    tableTiles.forEach((e, i) => put(e, CX - S * 0.22 + i * S * 0.13, H * 0.79 + i * S * 0.01, S * 0.09, S * 0.18, 1, -70 + i * 25, fade * ease(seg(t, 0.5 + i * 0.15, 1.1 + i * 0.15))));
    const k = ease(seg(t, 0.8, 1.8));
    put(t1, CX, V ? H * 0.47 : H * 0.48, W * 0.94, S * 0.12, 0.9 + 0.1 * k, 0, k * fade);
    return;
  }
  /* 2. the regulars (4 – 8.5) */
  if (t < 8.8) {
    const fade = 1 - seg(t, 8.4, 8.8);
    put(bgWarm, CX, CY, W, H, 1, 0, 1);
    put(burst, CX, CY, Math.max(W, H) * 1.6, Math.max(W, H) * 1.6, 1, t * 8, 0.6);
    const fs = S * (V ? 0.3 : 0.24);
    const xs = V ? [-0.3, 0, 0.3] : [-0.32, 0, 0.32], ys = V ? [0.36, 0.3, 0.36] : [0.44, 0.38, 0.44];
    faces.forEach((f, i) => {
      const k = back(seg(t, 4.2 + i * 0.3, 4.8 + i * 0.3));
      put(f, CX + xs[i] * (V ? W : W * 0.9), H * ys[i] + (1 - k) * S * 0.5, fs, fs, k, (i - 1) * 6, fade * clamp(k * 2));
      const b = back(seg(t, 5.3 + i * 0.35, 5.7 + i * 0.35));
      put(bubbles[i], CX + xs[i] * (V ? W : W * 0.9) + fs * 0.42, H * ys[i] - fs * 0.48, fs * 0.5, fs * 0.5, b, -8 + i * 8, fade * clamp(b * 2));
    });
    const k2 = ease(seg(t, 5.0, 5.8));
    put(t2, CX, V ? H * 0.62 : H * 0.78, W * 0.94, S * 0.1, 1, 0, k2 * fade);
    const h = back(seg(t, 6.8, 7.3));
    put(bigHi, V ? CX : CX + W * 0.36, V ? H * 0.78 : H * 0.7, S * 0.3, S * 0.3, h, Math.sin(t * 6) * 8, fade * clamp(h * 2) * (1 - seg(t, 8.0, 8.3)));
    return;
  }
  /* 3. the battle beats (8.5 – 14.5): four, each with its colour, its piece and its word */
  if (t < 14.6) {
    const beats = [
      { at: 8.6, c1: '#7a1424', c2: '#a51d33', word: T.slam },
      { at: 10.1, c1: '#0f5132', c2: '#167a4a', word: T.dush },
      { at: 11.6, c1: '#1b2a5c', c2: '#2a4590', word: T.mate },
      { at: 13.1, c1: '#7a4a0a', c2: '#b06f12', word: T.home },
    ];
    let b = 0; for (let i = 0; i < 4; i++) if (t >= beats[i].at) b = i;
    const B = beats[b], lt = t - B.at;
    put(bgWarm, CX, CY, W, H, 1, 0, 1);
    burst.innerHTML = rays(B.c1, B.c2); put(burst, CX, CY, Math.max(W, H) * 1.7, Math.max(W, H) * 1.7, 1 + lt * 0.05, t * 25, 1);
    const hit = b === 0 ? 0.42 : b === 1 ? 0.5 : b === 2 ? 0.55 : 0.6;   // the moment of impact
    const [sx, sy] = shake(S * 0.025, B.at + hit, 0.35);
    const cy = CY + (V ? -H * 0.05 : 0), G = V ? 1.35 : 1;   // pieces a size up on tall screens
    if (b === 0) {   // a double six slammed down from above
      const k = seg(lt, 0, hit), y = lerp(-S * 0.6, cy, k * k);
      put(bigTile, CX + sx, y + sy, S * 0.3 * G, S * 0.6 * G, lt < hit ? 1.6 - 0.6 * k : 1 + 0.06 * Math.sin(lt * 30) * (1 - seg(lt, hit, hit + 0.3)), lt < hit ? -25 + 25 * k : 0, 1);
    } else if (b === 1) {   // two dice tumble in and land on six–six
      dice.forEach((d, i) => {
        const k = ease(seg(lt, 0, hit)), dir = i ? 1 : -1;
        const x = CX + dir * lerp(W * 0.6, S * 0.17 * G, k) + sx, y = cy + Math.sin(k * Math.PI) * -S * 0.25 + sy;
        d.innerHTML = dieSvg(lt < hit ? 1 + Math.floor(rnd(Math.floor(lt * 14) + i * 7) * 6) : 6);
        put(d, x, y, S * 0.26 * G, S * 0.26 * G, 1, lt < hit ? lt * 900 * dir : dir * 8, 1);
      });
    } else if (b === 2) {   // the knight jumps onto the board
      put(board, CX + sx, cy + S * 0.12 * G + sy, S * 0.62 * G, S * 0.62 * G, 1, 0, 1);
      const k = ease(seg(lt, 0, hit));
      put(knight, lerp(CX - S * 0.32 * G, CX + S * 0.05 * G, k) + sx, cy - Math.sin(k * Math.PI) * S * 0.32 * G + sy, S * 0.24 * G, S * 0.29 * G, 1, (1 - k) * -20, 1);
    } else {   // ludo pawns racing, one hops home
      pawns.forEach((p, i) => {
        const k = ease(seg(lt, i * 0.06, hit)), hop = Math.abs(Math.sin(lt * 9 + i)) * S * 0.05 * (1 - seg(lt, hit, hit + 0.2));
        put(p, lerp(-S * 0.2, CX + (i - 1.5) * S * 0.22 * G, k) + sx, cy + S * 0.05 - hop + sy, S * 0.17 * G, S * 0.2 * G, i === 2 && lt > hit ? 1.25 : 1, 0, 1);
      });
    }
    // the word and the sparks at the impact
