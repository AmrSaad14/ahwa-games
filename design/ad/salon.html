<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Poppins:wght@600;800;900&display=block" rel="stylesheet">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;overflow:hidden;background:#12070a}
  .abs{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform,opacity}
  .txt{color:#fff;font-weight:900;text-align:center;white-space:nowrap;text-shadow:0 4px 18px rgba(0,0,0,.75)}
  .ar{font-family:Cairo,sans-serif;direction:rtl}
  .en{font-family:Poppins,sans-serif}
  .cap{color:#fff;font-weight:800;text-align:center;line-height:1.35;text-shadow:0 2px 3px rgba(0,0,0,.9),0 0 22px rgba(0,0,0,.6)}
  .who{color:#f3cd62;font-weight:900;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.8)}
  .chip{background:#f3cd62;color:#22120a;border-radius:999px;font-weight:900;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.45)}
  .pill{background:#f3cd62;color:#22120a;border-radius:999px;font-weight:900;text-align:center;box-shadow:0 10px 40px rgba(243,205,98,.45)}
</style></head>
<body><div id="stage"></div>
<script>
// The engagement-visit advert: the living-room film (AdSalon.cs) with a warm grade, captions, the four real games
// cut in (each with its name), and the end card. render(t) draws the frame at t seconds (compose-salon.mjs).
const P = new URLSearchParams(location.search);
const W = +P.get('w') || 1080, H = +P.get('h') || 1920, LANG = P.get('lang') || 'ar';
const AR = LANG === 'ar', V = H > W, S = Math.min(W, H), CX = W / 2;
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const A = 'assets/';
const EN = {
  f1: 'Before we talk about the shabka… you’ll play me.', g1: 'P-play you, sir?',
  g2: 'How about online, uncle? Each of us picks a game.', f2: 'Give it here. Tawla.',
  f3: 'Double six! Off you go… back home.', g3: 'No, no… dominoes. That one’s mine.',
  g4: 'Domino, uncle.', m1: 'Sorry, Hajj… I ate your piece. And yours too, Marwan.',
  b1: 'Checkmate, Dad.', f4: 'So you’re ALL on his side?!', f5: 'Wake up! The deciding match.',
  g5: 'Uncle… did I come to propose to your daughter, or to you?',
};
const NAME = { father: AR ? 'الحاج مجدي' : 'Hajj Magdy', groom: AR ? 'مروان، العريس' : 'Marwan, the groom', mother: AR ? 'ماما سهير' : 'Mama Soheir', bride: AR ? 'نور، العروسة' : 'Nour, the bride' };
const GAME = { tawla: AR ? 'طاولة' : 'Backgammon', domino: AR ? 'دومينو' : 'Dominoes', ludo: AR ? 'لودو' : 'Ludo', chess: AR ? 'شطرنج' : 'Chess' };
const T = {
  tag: AR ? 'اللي يكسب… يتكلم' : 'Whoever wins gets the say',
  play: AR ? 'العب ببلاش دلوقتي' : 'Play free now',
  games: AR ? 'دومينو · طاولة · شطرنج · لودو' : 'Dominoes · Backgammon · Chess · Ludo',
  online: AR ? 'مع أهلك وصحابك وناس من كل مصر' : 'With family, friends and players all over Egypt',
  late: AR ? '٢ الفجر' : '2 a.m.',
};
const font = AR ? 'ar' : 'en';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, x) => a + (b - a) * x;
const back = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function el(html, cls = '') { const d = document.createElement('div'); d.className = 'abs ' + cls; d.innerHTML = html; stage.appendChild(d); return d; }
function img(src, cls = '') { return el(`<img src="${A + src}" style="width:100%;height:100%;display:block">`, cls); }
function put(e, x, y, w, h, s = 1, r = 0, o = 1) {
  e.style.width = w + 'px'; e.style.height = h + 'px';
  e.style.transform = `translate(${x - w / 2}px,${y - h / 2}px) rotate(${r}deg) scale(${s})`;
  e.style.opacity = o; e.style.display = o <= 0.001 ? 'none' : 'block';
}
const hide = e => put(e, 0, 0, 1, 1, 1, 0, 0);

/* ---------- layers ---------- */
const film = el('<img style="width:100%;height:100%;object-fit:cover;display:block">'); const filmImg = film.querySelector('img');
const warm = el(''); warm.style.background = 'linear-gradient(180deg, rgba(255,170,90,.07), rgba(120,40,10,.10))'; warm.style.mixBlendMode = 'soft-light';
const vig = el(''); vig.style.background = 'radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 50%, rgba(10,4,2,.6) 100%)';
// the game cut-ins: full frame (landscape), or a phone held sideways over the same footage blurred (vertical)
const insBg = el('<img style="width:100%;height:100%;object-fit:cover;display:block;filter:blur(28px) brightness(.5) saturate(1.2)">');
const insFull = el('<img style="width:100%;height:100%;object-fit:cover;display:block">');
const phone = el('<img style="position:absolute;left:3.2%;top:5.5%;width:93.6%;height:89%;object-fit:cover;border-radius:2.2%/4%;display:block">');
phone.style.background = '#0d0b0a'; phone.style.borderRadius = '6%/11%'; phone.style.boxShadow = '0 30px 80px rgba(0,0,0,.7), 0 0 0 4px #2b2522 inset';
const flash = el(''); flash.style.background = '#fff';
const chip = el('', 'chip ' + font);
const late = el('', 'txt ' + font); late.style.color = '#cfe0ff';
const bottom = el(''); bottom.style.background = 'linear-gradient(180deg, rgba(0,0,0,0), rgba(8,3,1,.6))';
const bug = img('Logo.png');
const who = el('', 'who ' + font);
const cap = el('', 'cap ' + font);
const endBg = el(''); endBg.style.background = 'radial-gradient(ellipse at 50% 40%, rgba(70,28,12,.6), rgba(12,5,3,.93) 75%)';
const rays = el(''); rays.style.background = 'repeating-conic-gradient(from 0deg, rgba(243,205,98,.12) 0deg 7deg, rgba(243,205,98,0) 7deg 15deg)';
rays.style.borderRadius = '50%'; rays.style.webkitMaskImage = 'radial-gradient(circle, #000 20%, transparent 70%)';
const names = ['Shield', 'DominoLayer', 'DieLayer', 'Spark2', 'Crown', 'Ribbon'];
const crest = names.map(n => img(n + '.png'));
const PIV = { Shield: [.5, .5], DominoLayer: [.4, .46], DieLayer: [.62, .42], Spark2: [.5, 1 - 380 / 700], Crown: [.5, 1 - 100 / 700], Ribbon: [.5, 1 - 590 / 700] };
crest.forEach((c, i) => { const p = PIV[names[i]]; c.style.transformOrigin = `${p[0] * 100}% ${p[1] * 100}%`; });
const tTag = el('', 'txt ' + font); tTag.style.color = '#fff';
const tGames = el('', 'txt ' + font); tGames.style.color = '#ffe9b0'; tGames.style.fontWeight = '700';
const tOnline = el('', 'txt ' + font); tOnline.style.color = 'rgba(255,233,176,.85)'; tOnline.style.fontWeight = '700';
const playBtn = el('', 'pill ' + font);
const tStore = el('', 'txt en'); tStore.style.color = 'rgba(255,233,176,.75)'; tStore.style.fontWeight = '600';

/* ---------- inputs (compose-salon.mjs) ---------- */
window.FRAMES = window.FRAMES || []; window.FPS = 30; window.LINES = window.LINES || []; window.DURATION = 38;
window.INS = window.INS || {};   // { tawla: [files…], domino: […], ludo: […], chess: […] } at 30 fps

function wrap(s, maxChars) {
  if (s.length <= maxChars) return s;
  const mid = s.length / 2; let best = -1, bd = 1e9;
  for (let i = 0; i < s.length; i++) if (s[i] === ' ') { const d = Math.abs(i - mid) - ('،,…'.includes(s[i - 1]) ? 6 : 0); if (d < bd) { bd = d; best = i; } }
  return best < 0 ? s : s.slice(0, best) + '\n' + s.slice(best + 1);
}
function setSrc(im, src) { if (im.dataset.src !== src) { im.src = src; im.dataset.src = src; } }

window.render = function (t) {
  const D = window.DURATION, Lx = {}; for (const l of window.LINES) Lx[l.id] = l;
  const s_ = id => Lx[id].start, e_ = id => Lx[id].end;
  // the cut-ins, timed by the lines around them
  const cuts = [
    ['tawla', e_('f2') + 0.15, s_('f3') - 0.05], ['domino', e_('g3') + 0.15, s_('g4') - 0.05],
    ['ludo', e_('g4') + 1.0, s_('m1') - 0.1], ['chess', e_('b1') + 0.1, s_('f4') - 0.1]];
  const cut = cuts.find(c => t >= c[1] && t < c[2]);
  const endAt = s_('vo') - 0.3, nightAt = e_('f4') + 0.35;

  // the film
  const i = Math.min(window.FRAMES.length - 1, Math.max(0, Math.floor(t * window.FPS + 1e-6)));
  if (window.FRAMES.length) setSrc(filmImg, window.FRAMES[i]);
  const endK = ease(seg(t, endAt, endAt + 0.7));
  filmImg.style.filter = `contrast(1.07) saturate(${1.1 - endK * 0.3}) sepia(.08) brightness(${1.03 - endK * 0.3}) blur(${endK * S * 0.01}px)`;
  const fadeIn = ease(seg(t, 0, 0.25)), fadeOut = 1 - seg(t, D - 0.35, D);
  put(film, CX, H / 2, W, H, 1 + endK * 0.04, 0, fadeIn * fadeOut);
  put(warm, CX, H / 2, W, H, 1, 0, t > nightAt && t < endAt ? 0.3 : 1);
  put(vig, CX, H / 2, W, H, 1, 0, 1);

  // a game cut-in: a white flash in, a little punch of scale, the game's name on a gold chip
  if (cut) {
    const [g, a, b] = cut, files = window.INS[g] || [];
    const k = Math.min(files.length - 1, Math.floor((t - a + 1.5) * 30));   // from 1.5 s into the footage (the game under way)
    if (files.length) {
      const src = files[Math.max(0, k)];
      const pk = ease(seg(t, a, a + 0.25));
      if (V) {
        setSrc(insBg.querySelector('img'), src); setSrc(phone.querySelector('img'), src);
        put(insBg, CX, H / 2, W, H, 1, 0, 1);
        const pw = W * 0.96, ph = pw * 9 / 16 / 0.89 * 0.936;
        put(phone, CX, H * 0.45, pw, ph, lerp(1.12, 1, pk), 0, 1); hide(insFull);
      } else {
        setSrc(insFull.querySelector('img'), src);
        put(insFull, CX, H / 2, W, H, lerp(1.1, 1, pk), 0, 1); hide(insBg); hide(phone);
      }
      put(flash, CX, H / 2, W, H, 1, 0, 0.55 * (1 - seg(t, a, a + 0.12)));
      chip.textContent = GAME[g]; chip.style.fontSize = S * 0.05 + 'px'; chip.style.lineHeight = S * 0.09 + 'px';
      const cw = S * (AR ? 0.3 : 0.42), cy = V ? H * 0.24 : H * 0.12;
      put(chip, CX, cy, cw, S * 0.09, back(seg(t, a + 0.05, a + 0.35)), -3, clamp(seg(t, a + 0.05, a + 0.2) * 2) * (1 - seg(t, b - 0.12, b)));
    }
  } else { hide(insBg); hide(insFull); hide(phone); hide(flash); hide(chip); }

  // 2 a.m.
  late.textContent = T.late; late.style.fontSize = S * 0.075 + 'px';
  put(late, CX, V ? H * 0.2 : H * 0.18, W, S * 0.1, 1, 0, ease(seg(t, nightAt + 0.2, nightAt + 0.5)) * (1 - seg(t, s_('f5') - 0.6, s_('f5') - 0.3)));

  // captions: what is said (Egyptian Arabic, or the English subtitle), with who says it the first time they talk
  put(bottom, CX, H - H * (V ? 0.17 : 0.2), W, H * (V ? 0.34 : 0.4), 1, 0, (1 - endK) * (cut ? 0 : 1));
  const l = !cut && t < endAt ? window.LINES.find(x => x.id !== 'vo' && t >= x.start - 0.05 && t < x.end + 0.3) : null;
  if (l) {
    const o = ease(seg(t, l.start - 0.05, l.start + 0.15)) * (1 - seg(t, l.end + 0.1, l.end + 0.3));
    const txt = AR ? l.text : EN[l.id] || '';
    const size = S * (V ? 0.052 : 0.044);
    cap.style.whiteSpace = 'pre'; cap.textContent = wrap(txt, Math.floor((W * 0.86) / (size * (AR ? 0.5 : 0.52)))); cap.style.fontSize = size + 'px';
    const capY = V ? H * 0.79 : H * 0.84;
    put(cap, CX, capY, W * 0.94, size * 2.9, 1, 0, o);
    const first = window.LINES.find(x => x.who === l.who) === l;
    who.textContent = NAME[l.who] || ''; who.style.fontSize = size * 0.6 + 'px';
    const two = cap.textContent.includes('\n');
    put(who, CX, capY - size * (two ? 2.25 : 1.55), W * 0.7, size, 1, 0, first ? o : 0);
  } else { hide(cap); hide(who); }

  const bs = S * (V ? 0.14 : 0.1);
  put(bug, V ? W - bs * 0.75 : W - bs * 0.8, V ? bs * 0.85 : bs * 0.7, bs, bs * 700 / 600, 1, 0, (cut ? 0 : 0.8) * ease(seg(t, 1.5, 2.2)) * (1 - endK));

  // the end card
  put(endBg, CX, H / 2, W, H, 1, 0, endK * fadeOut);
  const lt = t - endAt - 0.15;
  const cw = S * (V ? 0.5 : 0.32), ch = cw * 700 / 600, ccy = V ? H * 0.31 : H * 0.33;
  put(rays, CX, ccy, S * 1.7, S * 1.7, 1, t * 8, endK * 0.9 * fadeOut);
  names.forEach((n, k) => {
    let s = 1, r = 0, o = 0, dx = 0, dy = 0;
    if (n === 'Shield') { const c = seg(lt, 0, 0.45); o = clamp(c * 2); s = lerp(0.6, 1, back(c)); }
    if (n === 'DominoLayer' || n === 'DieLayer') { const c = seg(lt, 0.3, 0.75), d = n === 'DieLayer' ? 1 : -1; o = clamp(c * 2.5); dx = d * (1 - back(c)) * cw * 0.6; r = d * (1 - back(c)) * 60; }
    if (n === 'Spark2') { const c = seg(lt, 0.7, 1.2); o = c <= 0 || c >= 1 ? 0 : c < 0.3 ? c / 0.3 : 1 - (c - 0.3) / 0.7; s = c < 0.3 ? lerp(0.2, 1.2, c / 0.3) : lerp(1.2, 1.5, (c - 0.3) / 0.7); r = -40 * c; }
    if (n === 'Crown') { const c = seg(lt, 0.9, 1.4); o = clamp(c * 3); dy = -(1 - back(c)) * ch * 0.12; }
    if (n === 'Ribbon') { const c = seg(lt, 1.2, 1.7); o = clamp(c * 3); s = lerp(0.05, 1, back(c)); }
    const e = crest[k];
    e.style.width = cw + 'px'; e.style.height = ch + 'px';
    e.style.transform = `translate(${CX - cw / 2 + dx}px,${ccy - ch / 2 + dy}px) rotate(${r}deg) scale(${n === 'Ribbon' ? s + ',' + lerp(0.6, 1, ease(seg(lt, 1.2, 1.7))) : s})`;
    e.style.opacity = o * fadeOut; e.style.display = o > 0.001 ? 'block' : 'none';
  });
  tTag.textContent = T.tag; tTag.style.fontSize = S * (V ? 0.072 : 0.06) + 'px';
  put(tTag, CX, V ? H * 0.52 : H * 0.6, W * 0.94, S * 0.1, lerp(0.9, 1, ease(seg(lt, 1.3, 1.7))), 0, ease(seg(lt, 1.3, 1.6)) * fadeOut);
  tGames.textContent = T.games; tGames.style.fontSize = S * (V ? 0.042 : 0.036) + 'px';
  put(tGames, CX, V ? H * 0.585 : H * 0.69, W * 0.94, S * 0.06, 1, 0, ease(seg(lt, 1.6, 2.0)) * fadeOut);
  tOnline.textContent = T.online; tOnline.style.fontSize = S * (V ? 0.034 : 0.03) + 'px';
  put(tOnline, CX, V ? H * 0.625 : H * 0.745, W * 0.94, S * 0.05, 1, 0, ease(seg(lt, 1.8, 2.2)) * fadeOut);
  const p = back(seg(lt, 2.0, 2.4));
  const bw = S * (V ? 0.66 : 0.44), bh = S * (V ? 0.13 : 0.1);
  playBtn.textContent = T.play; playBtn.style.fontSize = bh * 0.47 + 'px'; playBtn.style.lineHeight = bh + 'px';
  put(playBtn, CX, V ? H * 0.71 : H * 0.84, bw, bh, p * (1 + 0.035 * Math.sin(t * 7)), 0, clamp(p * 2) * fadeOut);
  tStore.textContent = 'Free on Google Play  ·  Qimma Labs'; tStore.style.fontSize = S * 0.028 + 'px';
  put(tStore, CX, V ? H * 0.9 : H * 0.94, W, S * 0.05, 1, 0, ease(seg(lt, 2.4, 2.9)) * fadeOut);
};
document.fonts.ready.then(() => { window.READY = true; });
</script></body></html>
