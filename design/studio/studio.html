<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Cairo:wght@600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
.wrap{width:900px;height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.name{font:700 76px Poppins,system-ui,sans-serif;letter-spacing:10px;color:#fff;line-height:1}
.name span{background:linear-gradient(90deg,#5eead4,#a78bfa);-webkit-background-clip:text;color:transparent}
.ar{font:600 30px Cairo,system-ui,sans-serif;color:#cbd5e1;letter-spacing:1px;margin-top:-4px}
.tag{font:600 15px Poppins,system-ui,sans-serif;color:#64748b;letter-spacing:6px}
</style></head><body>
<div class="wrap">
<svg width="170" height="170" viewBox="0 0 100 100">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
  <g transform="translate(50 50)">
    <!-- a blossom of light: six petals round a bright core -->
    <g fill="url(#g)" opacity=".95">
      <ellipse cx="0" cy="-24" rx="11" ry="22"/><ellipse cx="0" cy="-24" rx="11" ry="22" transform="rotate(60)"/><ellipse cx="0" cy="-24" rx="11" ry="22" transform="rotate(120)"/>
      <ellipse cx="0" cy="-24" rx="11" ry="22" transform="rotate(180)"/><ellipse cx="0" cy="-24" rx="11" ry="22" transform="rotate(240)"/><ellipse cx="0" cy="-24" rx="11" ry="22" transform="rotate(300)"/>
    </g>
    <circle r="13" fill="#0b0f17"/><circle r="7" fill="#fff"/>
  </g>
</svg>
<div class="name">NAWRA <span>LABS</span></div>
<div class="ar">نورة لابز</div>
<div class="tag">SOFTWARE · APPS · GAMES · AI</div>
</div></body></html>
