<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Cairo:wght@600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
.wrap{width:900px;height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.name{font:700 76px Poppins,system-ui,sans-serif;letter-spacing:10px;color:#fff;line-height:1}
.name span{background:linear-gradient(90deg,#5eead4,#a78bfa);-webkit-background-clip:text;color:transparent}
.ar{font:600 30px Cairo,system-ui,sans-serif;color:#cbd5e1;letter-spacing:1px;margin-top:-4px}
.tag{font:600 15px Poppins,system-ui,sans-serif;color:#64748b;letter-spacing:6px}
</style></head><body>
<div class="wrap">
<svg width="250" height="188" viewBox="0 0 120 90">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#4c1d95" stop-opacity=".9"/></linearGradient></defs>
  <!-- the summit: a tall peak in front of a lower one, with a bright point at the top -->
  <path d="M8 84 L44 34 L64 58 L80 40 L112 84 Z" fill="url(#h)" opacity=".55"/>
  <path d="M22 84 L60 14 L98 84 Z" fill="url(#g)"/>

</svg>
<div class="name">QIMMA <span>LABS</span></div>
<div class="tag">SOFTWARE · APPS · GAMES · AI</div>
</div></body></html>
