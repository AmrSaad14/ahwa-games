<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Cairo:wght@700&display=block" rel="stylesheet">
<style>
html,body{margin:0}
.f{width:1024px;height:500px;position:relative;overflow:hidden;background:radial-gradient(circle at 30% 45%,#8a1a2c 0,#4a0b16 45%,#1c0609 100%);font-family:Poppins,sans-serif}
.rays{position:absolute;left:-400px;top:-500px;width:1500px;height:1500px;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(243,205,98,.13) 0 6deg,transparent 6deg 22.5deg);}
.logo{position:absolute;left:70px;top:48px;height:404px}
.t{position:absolute;left:440px;top:112px;color:#fff;width:560px}
.t h1{margin:0;font-size:56px;font-weight:800;letter-spacing:1px;color:#f3cd62;text-shadow:0 4px 16px rgba(0,0,0,.5)}
.t h2{margin:6px 0 0;font:700 28px Cairo,sans-serif;color:#ffe9b0}
.t p{margin:22px 0 0;font-size:24px;font-weight:700;color:#fff;opacity:.92}
.chips{margin-top:26px;display:flex;gap:10px}
.chips span{background:rgba(0,0,0,.35);border:2px solid rgba(243,205,98,.6);color:#ffe9b0;border-radius:24px;padding:7px 14px;font-size:17px;font-weight:700}
</style></head><body><div class="f"><div class="rays"></div><img class="logo" src="logo.png">
<div class="t"><h1>BOARD BATTLES</h1><h2>بورد باتلز</h2><p>Play with friends at the café table</p>
<div class="chips"><span>Dominoes</span><span>Backgammon</span><span>Chess</span><span>Ludo</span></div></div></div></body></html>
