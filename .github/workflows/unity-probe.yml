name: Unity probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/unity-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - name: Inspect the Unity editor image
        run: |
          {
          TAG=ubuntu-6000.0.84f1-base-3.2.2
          docker pull -q unityci/editor:$TAG
          docker run --rm unityci/editor:$TAG bash -c '
            E=/opt/unity/Editor/Data
            ls $E
            echo ---managed; ls $E/Managed | head -40; ls $E/Managed/UnityEngine | head -90
            echo ---roslyn; ls $E/DotNetSdkRoslyn 2>/dev/null | head; ls $E/NetCoreRuntime 2>/dev/null | head
            echo ---netstd; find $E -name "netstandard.dll" | head
            echo ---builtin; ls $E/Resources/PackageManager/BuiltInPackages | head -90
            echo ---ugui; find $E/Resources/PackageManager/BuiltInPackages/com.unity.ugui -maxdepth 3 -type d | head -30
          '
          } > probe.txt 2>&1 || true
          gh release delete unity-probe --yes --cleanup-tag || true
          gh release create unity-probe probe.txt --title "Unity probe" --target "$GITHUB_SHA" --prerelease --notes probe
