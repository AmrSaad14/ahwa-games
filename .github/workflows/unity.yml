# Builds the Unity version of the game (unity/) on every change to it:
#  - a desktop build, run on a virtual screen to take screenshots (so changes can be checked without a phone)
#  - the Android APK
# Logs and screenshots go to the "unity-logs" release, the APK to the "unity-apk" release.
# Needs the repository secrets UNITY_EMAIL and UNITY_PASSWORD (a Unity account with a Personal license, no 2FA).
name: Unity build
on:
  push:
    branches: [main]
    paths: ['unity/**', '.github/workflows/unity.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unity-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE: unityci/editor:ubuntu-6000.0.84f1-android-3.2.2
    steps:
      - name: Free disk space (the Unity image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /opt/az /opt/microsoft /opt/google /usr/lib/jvm /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy || true
          docker system prune -af > /dev/null || true
          df -h /

      - uses: actions/checkout@v4

      - name: The café regulars (realistic humans made by the Characters workflow)
        run: |
          mkdir -p unity/Assets/Resources/People
          gh release download chars-glb -p "*.glb" -D unity/Assets/Resources/People --clobber || echo "no characters yet: the generated ones will be used"
          ls -la unity/Assets/Resources/People

      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: unity-library-${{ hashFiles('unity/Assets/**', 'unity/Packages/manifest.json') }}
          restore-keys: unity-library-

      - name: Note the versions
        run: |
          mkdir -p logs
          grep gltfast unity/Packages/manifest.json | tee logs/versions.txt

      - name: Build (desktop, then Android)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set +e
          mkdir -p build logs
          df -h / > logs/build-step.txt
          docker pull -q $IMAGE >> logs/build-step.txt 2>&1
          echo "pull exit $?" >> logs/build-step.txt
          # a license file only works on the computer that made it, so the seat comes from the Unity account
          # (Personal) for this run and goes back at the end
          docker run --rm -e UNITY_EMAIL -e UNITY_PASSWORD -v "$PWD":/w -w /w $IMAGE bash -c '
            LC=/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client
            for i in 1 2 3; do
              "$LC" --activate-all --include-personal --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" > /w/logs/activate.log 2>&1 && break
              sleep 20
            done
            echo "activate exit $?" > /w/logs/editor-exit.txt
            unity-editor -batchmode -nographics -quit -projectPath /w/unity -executeMethod BuildScript.BuildAll -logFile /w/logs/editor.log
            echo "build exit $?" >> /w/logs/editor-exit.txt
            unity-editor -batchmode -nographics -quit -returnlicense -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -logFile /w/logs/return.log
            echo "return exit $?" >> /w/logs/editor-exit.txt
            chmod -R a+rwX /w/build /w/logs /w/unity/Library 2>/dev/null
            true' >> logs/build-step.txt 2>&1
          echo "docker exit $?" >> logs/build-step.txt
          cat logs/build-step.txt logs/editor-exit.txt
          grep -E "^\[build|error CS|Error building|Scripts have compiler errors" logs/editor.log | head -60
          test -f build/android/BoardBattles.apk

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 22

      - name: A local game server for the test run
        if: always()
        run: |
          set +e
          npm install --no-audit --no-fund > logs/server-setup.txt 2>&1
          node scripts/build-server.mjs >> logs/server-setup.txt 2>&1
          PORT=8080 HOST=127.0.0.1 DB_PATH=/tmp/test.db BOT_FILL_SECONDS=2 nohup node dist/server.cjs > logs/server.log 2>&1 &
          sleep 3
          curl -s -o /dev/null -w "server: %{http_code}\n" http://127.0.0.1:8080/ | tee -a logs/server-setup.txt
          true

      - name: Screenshots of the desktop build
        if: always()
        run: |
          set +e
          mkdir -p shots
          if [ -f build/linux/BoardBattles.x86_64 ]; then
            sudo apt-get update -qq > logs/shots-step.txt 2>&1
            sudo apt-get install -y -qq xvfb mesa-utils libgl1 libegl1 libglx-mesa0 mesa-vulkan-drivers ffmpeg >> logs/shots-step.txt 2>&1
            echo "apt exit $?" >> logs/shots-step.txt
            chmod +x build/linux/BoardBattles.x86_64
            cd build/linux
            timeout 3000 xvfb-run -a -s "-screen 0 1280x720x24" ./BoardBattles.x86_64 -screen-width 1280 -screen-height 720 -screen-fullscreen 0 -force-glcore -logFile "$GITHUB_WORKSPACE/logs/player.log" -shots -server ws://127.0.0.1:8080/ws >> "$GITHUB_WORKSPACE/logs/shots-step.txt" 2>&1
            echo "player exit $?" >> "$GITHUB_WORKSPACE/logs/shots-step.txt"
            cp shots/*.png "$GITHUB_WORKSPACE/shots/" 2>/dev/null
            # the recorded frames → a short video of the run
            if ls shots/frames/*.png > /dev/null 2>&1; then
              ffmpeg -loglevel error -y -framerate 12 -i shots/frames/f%04d.png -vf scale=960:-2 -c:v libx264 -pix_fmt yuv420p -crf 24 -movflags +faststart "$GITHUB_WORKSPACE/shots/unity-run.mp4" >> "$GITHUB_WORKSPACE/logs/shots-step.txt" 2>&1
              echo "frames: $(ls shots/frames | wc -l)" >> "$GITHUB_WORKSPACE/logs/shots-step.txt"
            fi
            cd "$GITHUB_WORKSPACE"
          fi
          ls -la shots | tee -a logs/shots-step.txt
          true

      - name: Publish logs and screenshots
        if: always()
        run: |
          set +e
          if [ -f logs/editor.log ]; then tail -c 4000000 logs/editor.log > logs/editor-tail.log; fi
          files=$(ls logs/*.txt logs/activate.log logs/return.log logs/editor-tail.log logs/player.log logs/server.log shots/*.png shots/*.mp4 2>/dev/null)
          echo "publishing: $files"
          gh release delete unity-logs --yes --cleanup-tag
          for try in 1 2 3 4; do gh release create unity-logs $files --title "Unity build logs" --target "$GITHUB_SHA" --prerelease --notes "Unity build ${GITHUB_SHA::7}" && break; echo "release unity-logs: retry $try"; sleep 30; gh release delete unity-logs --yes --cleanup-tag; done

      - name: Publish the APK
        if: always()
        run: |
          if [ -f build/android/BoardBattles.apk ]; then
            cp build/android/BoardBattles.apk board-battles.apk
            gh release delete unity-apk --yes --cleanup-tag || true
            for try in 1 2 3 4; do gh release create unity-apk board-battles.apk --title "Unity APK" --target "$GITHUB_SHA" --prerelease --notes "Unity build ${GITHUB_SHA::7}" && break; echo "release unity-apk: retry $try"; sleep 30; gh release delete unity-apk --yes --cleanup-tag; done
          fi
