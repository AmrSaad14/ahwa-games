# Fetches the game server's recent logs for debugging. The repository is public, so the logs never appear in the
# run's output: they are encrypted with .github/logs-public-key.pem (only the holder of its private key can read
# them) and attached to the "server-logs" release. Run by hand: Actions → Server logs.
name: Server logs
on:
  workflow_dispatch:
    inputs:
      lines:
        description: How many recent lines
        default: '600'
permissions:
  contents: write
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: ${{ vars.DEPLOY_HOST || '46.225.157.22' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and encrypt
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          N="${{ github.event.inputs.lines || '600' }}"
          ssh root@"$HOST" "cd /opt/board-battles/app && docker compose -p board-battles logs --no-color --tail $N domino 2>&1; echo; echo '--- containers'; docker compose -p board-battles ps 2>&1" > /tmp/logs.txt 2>&1 || true
          openssl rand -out /tmp/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/logs.txt -out logs.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey .github/logs-public-key.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out key.enc
          rm -f /tmp/logs.txt /tmp/k.bin
          echo "encrypted $(wc -c < logs.enc) bytes"
      - name: Publish
        run: |
          gh release delete server-logs --yes --cleanup-tag 2>/dev/null || true
          gh release create server-logs logs.enc key.enc --title "Server logs (encrypted)" --prerelease --notes "Encrypted; see .github/workflows/server-logs.yml"
