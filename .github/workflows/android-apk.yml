# Builds an installable Android APK of the game on every push to main (or from the Actions tab).
# The APK is attached to the run as "kings-battle-apk" and published on the Releases page as "Latest APK"
# (tag apk-latest), so it can be downloaded straight to a phone.
#
# Online play needs your game server's address baked in: set a repository variable named SERVER_URL
# (Settings → Secrets and variables → Actions → Variables), e.g. https://games.example.com.
# Without it the app still installs and practice against the computer works offline.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the game client
        env:
          SERVER_URL: ${{ vars.SERVER_URL || 'https://kings-battle.onrender.com' }}   # the free Render server (render.yaml)
          # AdMob ad units (empty: Google's test ads)
          ADMOB_ANDROID_REWARDED: ${{ vars.ADMOB_ANDROID_REWARDED }}
          ADMOB_ANDROID_INTERSTITIAL: ${{ vars.ADMOB_ANDROID_INTERSTITIAL }}
        run: npm run build:client

      - name: Create the Android project
        env:
          ADMOB_APP_ID_ANDROID: ${{ vars.ADMOB_APP_ID_ANDROID }}
        run: |
          npx cap add android
          node scripts/native-permissions.mjs
          npx capacitor-assets generate --android --assetPath resources || echo "icons: kept the defaults"
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log

      # when the build breaks, keep the end of the Gradle log as a release so it can be read without the Actions UI
      - name: Publish the build log (only on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 400 gradle.log > build-log.txt || echo "no gradle log" > build-log.txt
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log build-log.txt --title "Last failed build log" --target "$GITHUB_SHA" --prerelease --notes "Failed build ${GITHUB_SHA::7}"

      # a copy on the run page; the release below is the real download, so a full storage quota must not stop it
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: kings-battle-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish as the latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk kings-battle.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest kings-battle.apk --title "Latest APK" --target "$GITHUB_SHA" --prerelease \
            --notes "Built from ${GITHUB_SHA::7}. Install on Android: download kings-battle.apk and allow installing from this source."
