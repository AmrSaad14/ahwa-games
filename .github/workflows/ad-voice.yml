# The advert's Egyptian voice-over (tools/ad): Azure's licensed voice when AZURE_SPEECH_KEY and AZURE_SPEECH_REGION
# are set as repository secrets, otherwise a draft for review. Results go to the "ad-voice" release.
name: Ad voice
on:
  push:
    branches: [main]
    paths: ['tools/ad/**', '.github/workflows/ad-voice.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
    steps:
      - uses: actions/checkout@v4
      - name: Make the voice
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q edge-tts numpy
          set -o pipefail
          python3 tools/ad/voice.py out 2>&1 | tee out-log.txt
          python3 tools/ad/voice.py out-salon tools/ad/salon/lines.json 2>&1 | tee salon-log.txt
      - name: Publish
        run: |
          publish() {   # tag, title, files…
            tag=$1; title=$2; shift 2
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            sleep 3
            for try in 1 2 3 4; do
              gh release create "$tag" "$@" --title "$title" --target "$GITHUB_SHA" --prerelease --notes "$title" && return 0
              echo "release $tag: retry $try"; sleep 20
            done
            return 1
          }
          ls -la out out-salon
          publish ad-voice "Ad voice" out/voice.wav out/timeline.json out/mouth.json out/l*.wav
          publish ad-voice-salon "Ad voice: the engagement visit" out-salon/*.wav out-salon/timeline.json out-salon/mouth.json
      - name: Keep the log
        if: always()
        run: |
          gh release delete ad-voice-log --yes --cleanup-tag 2>/dev/null || true
          gh release create ad-voice-log out-log.txt salon-log.txt --title "Ad voice log" --prerelease --notes "log" || true
