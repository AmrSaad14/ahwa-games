<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Board Battles · Control room</title>
<style>
:root{--bg:#120c08;--panel:#1c130d;--panel2:#241810;--line:#3a2a1e;--gold:#f3cd62;--gold2:#c9a25a;--text:#f4e6c8;--muted:#b9a88a;--ok:#4fae6a;--bad:#d4574a;--warn:#e0a03a;--ink:#1b120c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
a{color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{background:#0d0805;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:block;padding:4px 10px 16px;color:var(--gold);font-weight:800;font-size:16px}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px}
nav.side a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:9px;color:var(--text);text-decoration:none;margin-bottom:2px}
nav.side a:hover{background:var(--panel)}
nav.side a.on{background:var(--gold);color:var(--ink);font-weight:700}
.pill{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
nav.side a.on .pill{background:var(--ink);color:var(--gold)}
main{padding:22px 26px 60px;min-width:0}
h1{font-size:22px;margin:0 0 4px;color:var(--gold)}
h2{font-size:16px;margin:22px 0 10px;color:var(--gold)}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-size:24px;font-weight:800;color:#fff;letter-spacing:.2px}
.kpi .l{color:var(--muted);font-size:12px}
.kpi.alert{border-color:var(--warn)}
.flags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.flag{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.flag.on{background:rgba(79,174,106,.15);border-color:var(--ok);color:#9fe0b0}
.flag.off{color:var(--muted)}
.flag.warn{background:rgba(224,160,58,.15);border-color:var(--warn);color:#ffd08a}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--gold);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;background:var(--panel2)}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.btn{text-decoration:none;color:var(--text);border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--gold2)}
.btn.gold{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{background:#0d0805;border:1px solid var(--line);border-radius:9px;padding:7px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold2);outline-offset:-1px}
input[type=number]{width:150px}
td:first-child,td:nth-child(2){white-space:nowrap}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
label.f input,label.f select,label.f textarea{color:var(--text);font-size:14px;width:100%;min-width:0}
label.f input[type=color]{width:52px}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{width:38px;height:22px;appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;padding:0;border:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{left:19px}
.tabs{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 14px;cursor:pointer}
.tabs button.on{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.chart{display:block;width:100%;height:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);padding:10px 18px;border-radius:10px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:50}
.toast.err{background:var(--bad);color:#fff}
.drawer{position:fixed;inset:0 0 0 auto;width:min(720px,100%);background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding:20px 22px;z-index:40;box-shadow:-20px 0 40px rgba(0,0,0,.5)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
.x{float:right}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.tag.paid,.tag.on,.tag.google,.tag.apple{color:#9fe0b0;border-color:var(--ok)}
.tag.pending{color:#ffd08a;border-color:var(--warn)}
.tag.rejected,.tag.banned{color:#ff9d92;border-color:var(--bad)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:6px}
.round{display:grid;gap:8px;align-content:center;min-width:170px}
.match{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12px}
.match div{display:flex;justify-content:space-between}
.match .w{color:var(--gold);font-weight:700}
.ttl{--b:#fff;display:inline-flex;align-items:center;gap:6px;padding:3px 13px 3px 9px;border-radius:99px;border:1.5px solid var(--b);font-weight:800;font-size:13px;line-height:1.4;position:relative;overflow:hidden;white-space:nowrap;vertical-align:middle}
.ttl svg{width:16px;height:16px;flex:none}
.ttl.big{font-size:17px;padding:6px 18px 6px 12px}.ttl.big svg{width:21px;height:21px}
.ttl.fx-shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:ttlshine 2.6s ease-in-out infinite}
@keyframes ttlshine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
.ttl.fx-glow{animation:ttlglow 2s ease-in-out infinite}
@keyframes ttlglow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 12px 1px var(--b)}}
.ttl.fx-pulse{animation:ttlpulse 1.6s ease-in-out infinite}
@keyframes ttlpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.tgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.tcard{display:grid;gap:10px;align-content:start}
.tcard .pv{display:grid;gap:8px;justify-items:center;padding:14px 8px;background:#0d0805;border-radius:10px}
.iconpick{display:flex;flex-wrap:wrap;gap:6px}.iconpick button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#0d0805;color:var(--text);cursor:pointer;display:grid;place-items:center}
.iconpick button.on{border-color:var(--gold);background:var(--panel2)}.iconpick svg{width:20px;height:20px}
input[type=color]{width:52px;height:36px;padding:2px;cursor:pointer}
.login{max-width:360px;margin:12vh auto;padding:26px}
.empty{padding:22px;text-align:center;color:var(--muted)}
.tierrow td{padding:5px 8px}
.tierrow select,.tierrow input{padding:4px 6px}
@media (max-width:820px){.app{grid-template-columns:1fr}nav.side{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:8px}nav.side .brand{display:none}nav.side a{white-space:nowrap}main{padding:16px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => Number(n || 0).toLocaleString('en');
const short = n => { n = Number(n || 0); const a = Math.abs(n); return a >= 1e9 ? (n / 1e9).toFixed(a >= 1e10 ? 0 : 1) + 'B' : a >= 1e6 ? (n / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M' : a >= 1e3 ? Math.round(n / 1e3) + 'K' : String(n); };
const cairo = new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Cairo', dateStyle: 'medium', timeStyle: 'short' });
const when = t => t ? cairo.format(new Date(t)) : '—';
const ago = t => { if (!t) return '—'; const s = (Date.now() - t) / 1000; return s < 90 ? 'now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const GAMES = { rotate: 'Each week in turn', domino: 'Dominoes', tawla: 'Backgammon (tawla)', chess: 'Chess', ludo: 'Ludo' };
let state = { view: 'overview', catalog: null, pending: 0 };

async function api(path, opts = {}) {
  const r = await fetch('/api/admin' + path, { method: opts.method || (opts.body ? 'POST' : 'GET'), headers: { 'Content-Type': 'application/json' }, body: opts.body ? JSON.stringify(opts.body) : undefined, credentials: 'same-origin' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error('Signed out'); }
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function toast(msg, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 4500 : 2400); }
async function act(fn, ok) { try { const r = await fn(); if (ok) toast(ok); return r; } catch (e) { if (e.message !== 'Signed out') toast(e.message, true); throw e; } }

/* ---------------- titles: drawn the same way as in the game ---------------- */
function iconSvg(name) { const d = (state.catalog?.icons || {})[name]; return d ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="' + d + '"/></svg>' : ''; }
function badge(t, lang, big) {
  if (!t) return '';
  const s = t.style;
  return '<span class="ttl fx-' + esc(s.effect) + (big ? ' big' : '') + '" style="--b:' + esc(s.border) + ';background:linear-gradient(90deg,' + esc(s.bg[0]) + ',' + esc(s.bg[1]) + ');color:' + esc(s.fg) + '"' + (lang === 'ar' ? ' dir="rtl"' : '') + '>' + iconSvg(s.icon) + esc(lang === 'en' ? t.en : t.ar) + '</span>';
}
const titleById = id => (state.catalog?.titles || []).find(t => t.id === id);

/* ---------------- sign in ---------------- */
function showLogin() {
  $('#root').innerHTML = '<div class="card login"><h1>Control room</h1><p class="sub">Board Battles · enter the server\'s ADMIN_KEY</p>' +
    '<form id="lf" class="row" style="display:grid;gap:10px"><input id="lk" type="password" placeholder="Admin key" autocomplete="current-password" required>' +
    '<button class="btn gold">Sign in</button><div id="le" class="sub"></div></form></div>';
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    try { await api('/login', { body: { key: $('#lk').value } }); start(); }
    catch (er) { $('#le').textContent = er.message === 'admin_off' ? 'The dashboard is off: set ADMIN_KEY on the server.' : er.message === 'wrong_key' ? 'Wrong key.' : er.message; }
  };
  $('#lk').focus();
}

/* ---------------- the frame ---------------- */
const VIEWS = [
  ['overview', 'Overview'], ['prizes', 'Monthly prizes'], ['players', 'Players'], ['rewards', 'Rewards & notices'],
  ['tourney', 'Tournaments'], ['season', 'Season pass'], ['titles', 'Titles'], ['settings', 'Game settings'], ['reports', 'Reports & support'],
  ['purchases', 'Purchases'], ['log', 'Activity log'],
];
function frame() {
  $('#root').innerHTML = '<div class="app"><nav class="side"><div class="brand">♛ Board Battles<small>Control room</small></div>' +
    VIEWS.map(([k, l]) => '<a href="#' + k + '" data-v="' + k + '">' + l + (k === 'prizes' ? '<span class="pill" id="pendpill" hidden></span>' : '') + '</a>').join('') +
    '<a href="#" id="logout" style="margin-top:14px">Sign out</a></nav><main id="main"></main></div>';
  $('#logout').onclick = async e => { e.preventDefault(); await api('/logout', { body: {} }).catch(() => {}); showLogin(); };
}
function setPending(n) { state.pending = n; const p = $('#pendpill'); if (p) { p.hidden = !n; p.textContent = n; } }
async function go() {
  closeDrawer();
  const v = (location.hash.slice(1) || 'overview').split('/')[0];
  state.view = VIEWS.some(x => x[0] === v) ? v : 'overview';
  document.querySelectorAll('nav.side a[data-v]').forEach(a => a.classList.toggle('on', a.dataset.v === state.view));
  const main = $('#main'); main.innerHTML = '<div class="empty">Loading…</div>';
  try { await RENDER[state.view](main); } catch (e) { if (e.message !== 'Signed out') main.innerHTML = '<div class="card">Could not load: ' + esc(e.message) + '</div>'; }
}
async function start() {
  frame();
  try { state.catalog = await api('/catalog'); } catch { return; }
  window.onhashchange = go;
  go();
  setInterval(async () => { try { const o = await api('/overview'); setPending(o.prizePending); } catch {} }, 60000);
}

/* ---------------- charts (plain SVG) ---------------- */
function bars(rows, key, label, color) {
  const W = 460, H = 150, P = 14, max = Math.max(1, ...rows.map(r => r[key]));
  const bw = (W - P * 2) / rows.length;
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + (H + 34) + '" role="img" aria-label="' + esc(label) + '">';
  s += '<text x="0" y="14" fill="#b9a88a" font-size="14" font-weight="600">' + esc(label) + ' · last ' + rows.length + ' days</text>';
  rows.forEach((r, i) => {
    const h = Math.round((r[key] / max) * (H - 40)), x = P + i * bw + 3, y = H - h;
    s += '<rect x="' + x + '" y="' + y + '" width="' + (bw - 6) + '" height="' + Math.max(1, h) + '" rx="3" fill="' + color + '"><title>' + esc(r.day) + ': ' + num(r[key]) + '</title></rect>';
    if (r[key]) s += '<text x="' + (x + (bw - 6) / 2) + '" y="' + (y - 4) + '" fill="#f4e6c8" font-size="11" text-anchor="middle">' + short(r[key]) + '</text>';
    if ((i % 3 === 0 && i < rows.length - 2) || i === rows.length - 1) s += '<text x="' + (x + (bw - 6) / 2) + '" y="' + (H + 18) + '" fill="#b9a88a" font-size="11" text-anchor="middle">' + esc(r.day.slice(5)) + '</text>';
  });
  return s + '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + H + '" y2="' + H + '" stroke="#3a2a1e"/></svg>';
}

const RENDER = {};

/* ---------------- overview ---------------- */
RENDER.overview = async main => {
  const o = await api('/overview');
  setPending(o.prizePending);
  const k = (v, l, alert) => '<div class="card kpi' + (alert ? ' alert' : '') + '"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>';
  const f = (on, l, warn) => '<span class="flag ' + (warn && on ? 'warn' : on ? 'on' : 'off') + '">' + l + ': ' + (on ? 'on' : 'off') + '</span>';
  const t = o.tourney;
  main.innerHTML = '<h1>Overview</h1><div class="sub">Cairo time · updated ' + when(Date.now()) + '</div>' +
    '<div class="flags">' + f(o.flags.prizes, 'Monthly prizes') + f(o.flags.maintenance, 'Maintenance', true) + f(!!o.flags.notice, 'Notice') + f(t.enabled, 'Tournament') + f(o.flags.season, 'Season pass') + f(o.flags.push, 'Push') + '</div>' +
    '<div class="grid">' +
      k(num(o.live.online), 'Online now · ' + num(o.live.tables) + ' tables · ' + num(o.live.queued) + ' waiting') +
      k(num(o.activeToday), 'Played today · ' + num(o.activeWeek) + ' this week') +
      k(num(o.players), 'Players · ' + num(o.signedIn) + ' signed in · ' + num(o.newToday) + ' new today') +
      k(num(o.gamesToday), 'Games today · fees ' + short(o.houseFeesToday) + ' coins') +
      k(o.prizePending ? num(o.prizePending) + ' · ' + num(o.prizePendingEgp) + ' EGP' : '0', 'Prizes to pay · ' + num(o.prizeUnclaimed) + ' waiting for a number · ' + num(o.prizePaidEgp) + ' EGP paid in all', o.prizePending > 0) +
      k(num(o.seasonPremium), 'Season pass buyers this month') +
      k(num(o.purchasesToday) + ' / ' + num(o.purchasesWeek), 'Store purchases today / this week') +
      k(short(o.coinsHeld), 'Coins held by players') +
      k(num(o.reportsWeek), 'Player reports this week · ' + num(o.support) + ' support messages', o.reportsWeek > 20) +
      k(num(o.banned), 'Banned players') +
    '</div>' +
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(380px,1fr));margin-top:14px">' +
      '<div class="card">' + bars(o.daily, 'active', 'Players who played', '#c9a25a') + '</div>' +
      '<div class="card">' + bars(o.daily, 'games', 'Games finished', '#4fae6a') + '</div>' +
      '<div class="card">' + bars(o.daily, 'newPlayers', 'New players', '#6f9fd8') + '</div>' +
      '<div class="card">' + bars(o.daily, 'prizeEgp', 'Prizes paid (EGP)', '#e0a03a') + '</div>' +
    '</div>' +
    '<h2>Next tournament</h2><div class="card row" style="justify-content:space-between"><div><b>' + esc(GAMES[t.game] || t.game) + '</b> · ' + esc(t.state) + ' · ' + when(t.startsAt) + '<div class="sub">' + num(t.registered) + ' signed up</div></div><a class="btn" href="#tourney">Manage</a></div>' +
    (o.flags.notice ? '<h2>Notice showing</h2><div class="card">' + esc(o.flags.notice) + '</div>' : '');
};

/* ---------------- prize requests ---------------- */
RENDER.prizes = async main => {
  const status = (location.hash.split('/')[1]) || 'pending';
  const d = await api('/prizes?status=' + status);
  const rules = d.rules;
  const pend = d.rows.filter(r => r.status === 'pending');
  if (status === 'pending') setPending(pend.length);
  const GN = { domino: 'Dominoes', tawla: 'Backgammon', chess: 'Chess', ludo: 'Ludo' };
  const monthName = m => { const [y, mo] = m.split('-').map(Number); return new Date(Date.UTC(y, mo - 1, 15)).toLocaleString('en', { month: 'long', year: 'numeric' }); };
  const LABEL = { pending: 'To pay', unclaimed: 'Waiting for a number', paid: 'Paid', rejected: 'Rejected', expired: 'Expired', all: 'All' };
  main.innerHTML = '<h1>Monthly prizes · Vodafone Cash</h1>' +
    '<div class="sub">On the 1st of each month, the top player of each game\'s monthly leaderboard (at least ' + d.minGames + ' online games) wins <b>' + num(rules.egp) + ' EGP</b> and the "player of the month" title. ' +
      'The winner enters a Vodafone Cash number (' + esc(rules.prefixes.join(', ')) + ') in the game within ' + rules.claimDays + ' days. Prizes are <b>' + (rules.enabled ? 'on' : 'off') + '</b> (<a href="#settings">change</a>) · this month\'s race is on the <a href="#titles">Titles</a> page.</div>' +
    '<div class="tabs">' + Object.keys(LABEL).map(s => '<button data-s="' + s + '" class="' + (s === status ? 'on' : '') + '">' + LABEL[s] + '</button>').join('') + '</div>' +
    (status === 'pending' && pend.length ? '<div class="card" style="margin-bottom:12px">To pay: <b>' + pend.length + '</b> · <b>' + num(pend.reduce((a, r) => a + r.egp, 0)) + ' EGP</b>. Send the money on Vodafone Cash, then press <b>Paid</b> (the winner gets a notification). <b>Ask again</b> if the number is wrong; <b>Reject</b> if the win broke the rules (cheating, several accounts).</div>' : '') +
    (d.rows.length ? '<div class="tablewrap"><table><thead><tr><th>#</th><th>Month</th><th>Game</th><th>Winner</th><th>Vodafone Cash</th><th class="num">EGP</th><th>Status</th><th></th></tr></thead><tbody>' +
      d.rows.map(r => '<tr><td class="mono">' + r.id + '</td><td>' + esc(monthName(r.month)) + '</td><td>' + esc(GN[r.game] || r.game) + '</td><td><a href="#players/' + esc(r.user_id) + '" data-player="' + esc(r.user_id) + '">' + esc(r.name || '—') + '</a><div class="sub">won ' + when(r.ts) + '</div></td>' +
        '<td>' + (r.phone ? '<b class="mono" style="font-size:14px">' + esc(r.phone) + '</b> <button class="btn sm" data-copy="' + esc(r.phone) + '">Copy</button>' : '<span class="muted">not given yet</span>') + '</td><td class="num"><b>' + num(r.egp) + '</b></td>' +
        '<td><span class="tag ' + (r.status === 'unclaimed' ? '' : r.status === 'expired' ? 'rejected' : r.status) + '">' + (LABEL[r.status] || r.status) + '</span>' + (r.done_ts ? '<div class="sub">' + when(r.done_ts) + '</div>' : '') + (r.note ? '<div class="sub">' + esc(r.note) + '</div>' : '') + '</td>' +
        '<td>' + (r.status === 'pending' ? '<div class="row"><button class="btn sm ok" data-pay="' + r.id + '" data-egp="' + r.egp + '" data-phone="' + esc(r.phone) + '">Paid</button><button class="btn sm" data-again="' + r.id + '">Ask again</button><button class="btn sm bad" data-rej="' + r.id + '">Reject</button></div>'
          : r.status === 'unclaimed' ? '<button class="btn sm bad" data-rej="' + r.id + '">Reject</button>' : '') + '</td></tr>').join('') +
      '</tbody></table></div>' : '<div class="card empty">Nothing here</div>');
  main.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { location.hash = 'prizes/' + b.dataset.s; });
  main.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => { navigator.clipboard.writeText(b.dataset.copy); toast('Copied ' + b.dataset.copy); });
  const settle = (id, action, note, ok) => act(() => api('/prizes/' + id, { body: { action, note } }), ok).then(go);
  main.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => { const note = prompt('Sent ' + b.dataset.egp + ' EGP to ' + b.dataset.phone + '?\nTransaction number (optional):', ''); if (note !== null) settle(b.dataset.pay, 'paid', note, 'Marked paid · the winner was told'); });
  main.querySelectorAll('[data-again]').forEach(b => b.onclick = () => { const note = prompt('Ask the winner for their number again?\nWhat was wrong (they see it):', 'الرقم مش على فودافون كاش'); if (note !== null) settle(b.dataset.again, 'again', note, 'The winner was asked again'); });
  main.querySelectorAll('[data-rej]').forEach(b => b.onclick = () => { const note = prompt('Reject this prize for good?\nReason (the winner sees it):', ''); if (note !== null) settle(b.dataset.rej, 'reject', note, 'Rejected'); });
  main.querySelectorAll('[data-player]').forEach(a => a.onclick = e => { e.preventDefault(); openPlayer(a.dataset.player); });
};

async function openPlayer(id) {
  closeDrawer();
  const sh = document.createElement('div'); sh.className = 'shade'; sh.onclick = closeDrawer;
  const dr = document.createElement('div'); dr.className = 'drawer'; dr.innerHTML = '<div class="empty">Loading…</div>';
  document.body.append(sh, dr);
  const render = async () => {
    const d = await api('/players/' + encodeURIComponent(id));
    const u = d.user, s = d.stats || {}, r = d.row;
    const skins = state.catalog.skins.filter(k => !k.free && !d.skins.includes(k.id));
    dr.innerHTML = '<button class="btn sm x" id="cx">Close ✕</button><h1>' + esc(u.name) + '</h1>' + (d.title ? '<div style="margin:4px 0 6px">' + badge(titleById(d.title), 'en') + '</div>' : '') +
      '<div class="sub mono">' + esc(u.id) + ' · code ' + esc(r.code || '—') + ' · ' + r.login + (r.contact ? ' · ' + esc(r.contact) : '') + '</div>' +
      '<div class="flags">' + (d.online ? '<span class="flag on">online</span>' : '<span class="flag off">last seen ' + ago(u.seen) + '</span>') + (r.banned ? '<span class="flag warn">banned: ' + esc(u.ban_reason || '') + '</span>' : '') + (r.muted ? '<span class="flag warn">muted</span>' : '') + (d.season.premium ? '<span class="flag on">season premium</span>' : '') + '</div>' +
      '<div class="grid">' +
        '<div class="card kpi"><div class="v">' + num(u.coins) + '</div><div class="l">Coins</div></div>' +
        '<div class="card kpi"><div class="v">' + num(s.games) + '</div><div class="l">Games · ' + num(s.wins) + ' won · ' + (s.winRate || 0) + '%</div></div>' +
        '<div class="card kpi"><div class="v">' + short(s.net) + '</div><div class="l">Net from games · won ' + short(s.coinsWon) + ' / lost ' + short(s.coinsLost) + '</div></div>' +
        '<div class="card kpi"><div class="v">' + (s.level || 1) + '</div><div class="l">Level · season tier ' + d.season.tier + ' (' + d.season.sp + ' SP)</div></div>' +
      '</div>' +
      '<h2>Actions</h2><div class="card" style="display:grid;gap:10px">' +
        '<div class="row"><input id="pc" type="number" placeholder="Coins (− takes)" style="width:170px"><input id="pr" placeholder="Reason (log)"><button class="btn gold" id="bc">Give / take coins</button></div>' +
        '<div class="row"><select id="ps"><option value="">Give a skin…</option>' + skins.map(k => '<option value="' + k.id + '">' + esc(k.cat + ' · ' + k.id) + (k.pass ? ' (season)' : '') + '</option>').join('') + '</select><button class="btn" id="bs">Give skin</button>' +
          '<button class="btn" id="bp">' + (d.season.premium ? 'Remove season premium' : 'Give season premium') + '</button><input id="psp" type="number" placeholder="Season points" value="' + d.season.sp + '"><button class="btn" id="bsp">Set SP</button></div>' +
        '<div class="row"><input id="pn" placeholder="New name" value="' + esc(u.name) + '"><button class="btn" id="bn">Rename</button>' +
          (r.muted ? '<button class="btn" id="bum">Unmute</button>' : '<button class="btn" id="bm">Mute 24 h</button>') +
          (r.banned ? '<button class="btn ok" id="bub">Unban</button>' : '<button class="btn bad" id="bb">Ban</button>') + '</div>' +
        '<div class="row"><input id="pt" placeholder="Push title" style="width:180px"><input id="px" placeholder="Push message to this player" style="flex:1;min-width:220px"><button class="btn" id="bx">Send</button></div>' +
        '<div class="row"><button class="btn bad sm" id="bd">Delete account</button><span class="sub">Removes the player and everything they have. Can\'t be undone.</span></div>' +
      '</div>' +
      '<h2>Coin history</h2>' + (d.coins.length ? '<div class="tablewrap"><table><thead><tr><th>When</th><th>What</th><th class="num">Change</th><th class="num">Balance</th></tr></thead><tbody>' +
        d.coins.map(c => '<tr><td>' + when(c.ts) + '</td><td>' + esc(c.kind) + (c.mode ? ' · ' + esc(c.mode) : '') + (c.stake ? ' · stake ' + short(c.stake) : '') + '</td><td class="num" style="color:' + (c.delta >= 0 ? '#9fe0b0' : '#ff9d92') + '">' + (c.delta >= 0 ? '+' : '') + num(c.delta) + '</td><td class="num">' + num(c.balance) + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="card empty">None</div>') +
      '<h2>Monthly prizes</h2>' + (d.prizes.length ? '<table><tbody>' + d.prizes.map(c => '<tr><td>#' + c.id + '</td><td>' + esc(c.month) + ' · ' + esc(c.game) + '</td><td class="mono">' + esc(c.phone || '—') + '</td><td class="num">' + num(c.egp) + ' EGP</td><td><span class="tag ' + c.status + '">' + c.status + '</span></td></tr>').join('') + '</tbody></table>' : '<div class="card empty">None</div>') +
      '<h2>Purchases</h2>' + (d.purchases.length ? '<table><tbody>' + d.purchases.map(p => '<tr><td>' + when(p.ts) + '</td><td>' + esc(p.product) + '</td><td class="mono">' + esc(p.order_id || '') + '</td></tr>').join('') + '</tbody></table>' : '<div class="card empty">None</div>') +
      '<h2>Skins (' + d.skins.length + ')</h2><div class="card">' + (d.skins.map(k => '<span class="tag" style="margin:2px">' + esc(k) + ' <a href="#" data-unskin="' + esc(k) + '" title="Take back">✕</a></span>').join('') || '<span class="muted">Only the free ones</span>') + '</div>' +
      '<h2>Titles</h2><div class="card" style="display:grid;gap:10px">' + (d.titles.length ? '<div class="row">' + d.titles.map(t => '<span>' + badge(titleById(t.id), 'en') + (d.title === t.id ? ' <span class="tag on">wearing</span>' : '') + (t.until ? ' <span class="sub">until ' + when(t.until) + '</span>' : '') + ' <a href="#" data-untitle="' + esc(t.id) + '" title="Take back">✕</a></span>').join('') + '</div>' : '<span class="muted">No titles</span>') +
        '<div class="row"><select id="pti"><option value="">Give a title…</option>' + state.catalog.titles.filter(t => !t.monthly).map(t => '<option value="' + t.id + '">' + esc(t.en + ' · ' + t.ar) + '</option>').join('') + '</select><select id="ptd"><option value="0">for good</option><option value="7">7 days</option><option value="30">30 days</option><option value="90">90 days</option></select><button class="btn" id="bti">Give title</button></div></div>' +
      '<h2>Reports about this player (' + d.reportsAbout.length + ')</h2>' + (d.reportsAbout.length ? '<table><tbody>' + d.reportsAbout.map(x => '<tr><td>' + when(x.ts) + '</td><td>' + esc(x.reason) + '</td><td>by ' + esc(x.from_name || x.from_id) + '</td></tr>').join('') + '</tbody></table>' : '<div class="card empty">None</div>');
    const post = (body, ok) => act(() => api('/players/' + encodeURIComponent(id), { body }), ok).then(render);
    $('#cx', dr).onclick = closeDrawer;
    $('#bc', dr).onclick = () => { const a = Number($('#pc', dr).value); if (!a) return toast('Enter an amount', true); if (Math.abs(a) >= 10000000 && !confirm('That is ' + num(a) + ' coins. Sure?')) return; post({ action: 'coins', amount: a, reason: $('#pr', dr).value }, (a > 0 ? 'Gave ' : 'Took ') + num(Math.abs(a)) + ' coins'); };
    $('#bs', dr).onclick = () => { const k = $('#ps', dr).value; if (k) post({ action: 'skin', skin: k }, 'Skin given'); };
    $('#bp', dr).onclick = () => post({ action: d.season.premium ? 'unpremium' : 'premium' }, 'Season pass updated');
    $('#bsp', dr).onclick = () => post({ action: 'sp', sp: Number($('#psp', dr).value) }, 'Season points set');
    $('#bn', dr).onclick = () => post({ action: 'rename', name: $('#pn', dr).value }, 'Renamed');
    if ($('#bm', dr)) $('#bm', dr).onclick = () => post({ action: 'mute', hours: 24 }, 'Muted for 24 h');
    if ($('#bum', dr)) $('#bum', dr).onclick = () => post({ action: 'unmute' }, 'Unmuted');
    if ($('#bb', dr)) $('#bb', dr).onclick = () => { const why = prompt('Ban ' + u.name + '? Reason (they see it):', ''); if (why !== null) post({ action: 'ban', reason: why }, 'Banned'); };
    if ($('#bub', dr)) $('#bub', dr).onclick = () => post({ action: 'unban' }, 'Unbanned');
    $('#bx', dr).onclick = () => { const t = $('#px', dr).value; if (t) post({ action: 'notify', title: $('#pt', dr).value, text: t }, 'Sent'); };
    $('#bd', dr).onclick = () => { if (prompt('Type DELETE to delete ' + u.name + ' for good') === 'DELETE') act(() => api('/players/' + encodeURIComponent(id), { body: { action: 'delete' } }), 'Deleted').then(() => { closeDrawer(); go(); }); };
    $('#bti', dr).onclick = () => { const k = $('#pti', dr).value; if (k) post({ action: 'title', title: k, days: Number($('#ptd', dr).value) }, 'Title given'); };
    dr.querySelectorAll('[data-untitle]').forEach(a => a.onclick = e => { e.preventDefault(); if (confirm('Take back this title?')) post({ action: 'untitle', title: a.dataset.untitle }, 'Title taken back'); });
    dr.querySelectorAll('[data-unskin]').forEach(a => a.onclick = e => { e.preventDefault(); if (confirm('Take back ' + a.dataset.unskin + '?')) post({ action: 'unskin', skin: a.dataset.unskin }, 'Skin taken back'); });
  };
  try { await render(); } catch (e) { dr.innerHTML = '<button class="btn sm x" onclick="closeDrawer()">Close ✕</button><div class="card">' + esc(e.message) + '</div>'; }
}
function closeDrawer() { document.querySelectorAll('.drawer,.shade').forEach(x => x.remove()); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

      '<div class="row" style="margin-top:12px"><label class="switch"><input type="checkbox" id="np"> Also a push to players of the last 30 days</label><button class="btn gold" id="nb">Show notice</button>' + (live ? '<button class="btn" id="nc">Take it down</button>' : '') + '</div></div>' +

    const r = await act(() => api('/rewards', { body: { coins: c, activeDays: days, message: $('#gm').value, push: $('#gp').checked } }));
    toast('Sent to ' + num(r.players) + ' players');

  if ($('#nc')) $('#nc').onclick = async () => { await act(() => api('/notice', { body: { text: '' } }), 'Notice taken down'); go(); };

function drawer() {
  closeDrawer();
  const sh = document.createElement('div'); sh.className = 'shade'; sh.onclick = closeDrawer;
  const dr = document.createElement('div'); dr.className = 'drawer';
  document.body.append(sh, dr);
  return dr;
}

function titleEditor(t) {
  const isNew = !t;
  const cur = t ? structuredClone(t) : { id: '', ar: '', en: '', style: { bg: ['#f3cd62', '#b8862b'], fg: '#2a1a05', border: '#fff3c4', icon: 'crown', effect: 'shine' } };
  const dr = drawer();
  const icons = Object.keys(state.catalog.icons);
  dr.innerHTML = '<button class="btn sm x" id="cx">Close ✕</button><h1>' + (isNew ? 'New title' : 'Edit title') + '</h1>' +
    '<div class="card" style="display:grid;gap:12px;justify-items:center;padding:26px;margin:14px 0;background:#0d0805"><div id="pv1"></div><div id="pv2"></div><div class="sub">Preview: what players see</div></div>' +
    '<div class="form">' +
      (isNew ? '<label class="f">Id (english letters, no spaces)<input id="ti" placeholder="e.g. night_owl" maxlength="32"></label>' : '') +
      '<label class="f">Arabic name<input id="tar" dir="rtl" maxlength="30" value="' + esc(cur.ar) + '"></label>' +
      '<label class="f">English name<input id="ten" maxlength="30" value="' + esc(cur.en) + '"></label>' +
    '</div><h2>Design</h2><div class="form">' +
      '<label class="f">Background (start)<input type="color" id="b0" value="' + cur.style.bg[0] + '"></label>' +
      '<label class="f">Background (end)<input type="color" id="b1" value="' + cur.style.bg[1] + '"></label>' +
      '<label class="f">Text and icon<input type="color" id="fg" value="' + cur.style.fg + '"></label>' +
      '<label class="f">Border<input type="color" id="bd" value="' + cur.style.border + '"></label>' +
      '<label class="f">Effect<select id="fx">' + [['none', 'None'], ['shine', 'Shine: a light sweeps across'], ['glow', 'Glow: the border breathes'], ['pulse', 'Pulse: beats gently']].map(([k, l]) => '<option value="' + k + '"' + (k === cur.style.effect ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></label>' +
    '</div><div class="sub" style="margin:12px 0 6px">Icon</div><div class="iconpick">' + icons.map(k => '<button type="button" data-ic="' + k + '" title="' + k + '" class="' + (k === cur.style.icon ? 'on' : '') + '">' + (k === 'none' ? '∅' : iconSvg(k)) + '</button>').join('') + '</div>' +
    '<div class="sub" style="margin:14px 0 6px">Quick looks</div><div class="row" id="presets"></div>' +
    '<div class="row" style="margin-top:18px"><button class="btn gold" id="tsv">' + (isNew ? 'Create title' : 'Save') + '</button></div>';
  const PRESETS = [['Gold', '#ffe08a', '#b8862b', '#2a1a05', '#fff6d6'], ['Emerald', '#11804f', '#063b25', '#ffd76a', '#ffd76a'], ['Royal', '#2c4bb0', '#0e1a4a', '#ffd76a', '#ffd76a'], ['Ruby', '#9c2430', '#4a0d14', '#ffd76a', '#ffd76a'],
    ['Night', '#2b2b2b', '#0d0d0d', '#f3cd62', '#f3cd62'], ['Ice', '#18c3d6', '#0a5d8f', '#ffffff', '#c9f7ff'], ['Sunset', '#ff7a59', '#c2185b', '#ffffff', '#ffd1c2'], ['Wood', '#4a3526', '#1b120c', '#f4e6c8', '#c9a25a']];
  $('#presets', dr).innerHTML = PRESETS.map((p, i) => '<button class="btn sm" data-pre="' + i + '" style="background:linear-gradient(90deg,' + p[1] + ',' + p[2] + ');color:' + p[3] + ';border-color:' + p[4] + '">' + p[0] + '</button>').join('');
  const read = () => ({ id: isNew ? $('#ti', dr).value.trim().toLowerCase() : cur.id, ar: $('#tar', dr).value, en: $('#ten', dr).value,
    style: { bg: [$('#b0', dr).value, $('#b1', dr).value], fg: $('#fg', dr).value, border: $('#bd', dr).value, icon: cur.style.icon, effect: $('#fx', dr).value } });
  const draw = () => { const v = read(); $('#pv1', dr).innerHTML = badge({ ...v, ar: v.ar || 'اسم اللقب' }, 'ar', true); $('#pv2', dr).innerHTML = badge({ ...v, en: v.en || 'Title name' }, 'en'); };
  dr.querySelectorAll('input,select').forEach(i => i.oninput = draw);
  dr.querySelectorAll('[data-ic]').forEach(b => b.onclick = () => { cur.style.icon = b.dataset.ic; dr.querySelectorAll('[data-ic]').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  dr.querySelectorAll('[data-pre]').forEach(b => b.onclick = () => { const p = PRESETS[b.dataset.pre]; $('#b0', dr).value = p[1]; $('#b1', dr).value = p[2]; $('#fg', dr).value = p[3]; $('#bd', dr).value = p[4]; draw(); });
  $('#cx', dr).onclick = closeDrawer;
  $('#tsv', dr).onclick = async () => {
    const v = read();
    if (!/^[a-z0-9_]{2,32}$/.test(v.id)) return toast('The id needs 2+ english letters, numbers or _', true);
    if (!v.ar.trim() || !v.en.trim()) return toast('Write both names', true);
    if (isNew && state.catalog.titles.some(t => t.id === v.id)) return toast('That id is taken', true);
    await act(() => api('/titles', { method: 'PUT', body: v }), 'Saved · players see it at once'); closeDrawer(); go();
  };
  draw();
}

    '<div class="flags">' + Object.entries(byProduct).map(([k, v]) => '<span class="flag">' + esc(k) + ': ' + v + '</span>').join('') + '</div>' +
    (d.rows.length ? '<div class="tablewrap"><table><thead><tr><th>When</th><th>Player</th><th>Product</th><th class="num">Coins</th><th>Order</th></tr></thead><tbody>' +
      d.rows.map(p => '<tr><td>' + when(p.ts) + '</td><td><a href="#players/' + esc(p.user_id) + '">' + esc(p.name || p.user_id) + '</a></td><td>' + esc(p.product) + '</td><td class="num">' + (p.coins ? num(p.coins) : '') + '</td><td class="mono">' + esc(p.order_id || '') + '</td></tr>').join('') +
      '</tbody></table></div>' : '<div class="card empty">No purchases yet</div>');
};

/* ---------------- activity log ---------------- */
RENDER.log = async main => {
  const d = await api('/log');
  main.innerHTML = '<h1>Activity log</h1><div class="sub">What was done from this dashboard</div>' +
    (d.rows.length ? '<div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Player</th><th>Details</th></tr></thead><tbody>' +
      d.rows.map(x => '<tr><td>' + when(x.ts) + '</td><td class="mono">' + esc(x.who) + '</td><td><b>' + esc(x.action) + '</b></td><td>' + (x.target ? '<a href="#players/' + esc(x.target) + '" class="mono">' + esc(x.target) + '</a>' : '') + '</td><td class="mono" style="max-width:420px;word-break:break-word">' + esc(x.detail || '') + '</td></tr>').join('') +
      '</tbody></table></div>' : '<div class="card empty">Nothing yet</div>');
};

// players linked from anywhere (#players/ID) open in the drawer
window.addEventListener('hashchange', () => { const p = location.hash.split('/'); if (p[0] === '#players' && p[1] && state.view !== 'players') {} });

api('/overview').then(start).catch(e => { if (e.message !== 'Signed out') { $('#root').innerHTML = '<div class="card login">' + (e.message === 'admin_off' ? 'The dashboard is off: set <b>ADMIN_KEY</b> on the server, then reload.' : esc(e.message)) + '</div>'; } });
</script>
</body>
</html>
