<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Board Battles · Control room</title>
<style>
:root{--bg:#120c08;--panel:#1c130d;--panel2:#241810;--line:#3a2a1e;--gold:#f3cd62;--gold2:#c9a25a;--text:#f4e6c8;--muted:#b9a88a;--ok:#4fae6a;--bad:#d4574a;--warn:#e0a03a;--ink:#1b120c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
a{color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{background:#0d0805;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:block;padding:4px 10px 16px;color:var(--gold);font-weight:800;font-size:16px}
.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px}
nav.side a{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-radius:9px;color:var(--text);text-decoration:none;margin-bottom:2px}
nav.side a:hover{background:var(--panel)}
nav.side a.on{background:var(--gold);color:var(--ink);font-weight:700}
.pill{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
nav.side a.on .pill{background:var(--ink);color:var(--gold)}
main{padding:22px 26px 60px;min-width:0}
h1{font-size:22px;margin:0 0 4px;color:var(--gold)}
h2{font-size:16px;margin:22px 0 10px;color:var(--gold)}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-size:24px;font-weight:800;color:#fff;letter-spacing:.2px}
.kpi .l{color:var(--muted);font-size:12px}
.kpi.alert{border-color:var(--warn)}
.flags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.flag{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.flag.on{background:rgba(79,174,106,.15);border-color:var(--ok);color:#9fe0b0}
.flag.off{color:var(--muted)}
.flag.warn{background:rgba(224,160,58,.15);border-color:var(--warn);color:#ffd08a}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--gold);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;background:var(--panel2)}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.btn{text-decoration:none;color:var(--text);border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--gold2)}
.btn.gold{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{background:#0d0805;border:1px solid var(--line);border-radius:9px;padding:7px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold2);outline-offset:-1px}
input[type=number]{width:150px}
td:first-child,td:nth-child(2){white-space:nowrap}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
label.f input,label.f select,label.f textarea{color:var(--text);font-size:14px;width:100%;min-width:0}
label.f input[type=color]{width:52px}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{width:38px;height:22px;appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;padding:0;border:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{left:19px}
.tabs{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 14px;cursor:pointer}
.tabs button.on{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.chart{display:block;width:100%;height:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);padding:10px 18px;border-radius:10px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:50}
.toast.err{background:var(--bad);color:#fff}
.drawer{position:fixed;inset:0 0 0 auto;width:min(720px,100%);background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding:20px 22px;z-index:40;box-shadow:-20px 0 40px rgba(0,0,0,.5)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
.x{float:right}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.tag.paid,.tag.on,.tag.google,.tag.apple{color:#9fe0b0;border-color:var(--ok)}
.tag.pending{color:#ffd08a;border-color:var(--warn)}
.tag.rejected,.tag.banned{color:#ff9d92;border-color:var(--bad)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:6px}
.round{display:grid;gap:8px;align-content:center;min-width:170px}
.match{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12px}
.match div{display:flex;justify-content:space-between}
.match .w{color:var(--gold);font-weight:700}
.ttl{--b:#fff;display:inline-flex;align-items:center;gap:6px;padding:3px 13px 3px 9px;border-radius:99px;border:1.5px solid var(--b);font-weight:800;font-size:13px;line-height:1.4;position:relative;overflow:hidden;white-space:nowrap;vertical-align:middle}
.ttl svg{width:16px;height:16px;flex:none}
.ttl.big{font-size:17px;padding:6px 18px 6px 12px}.ttl.big svg{width:21px;height:21px}
.ttl.fx-shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:ttlshine 2.6s ease-in-out infinite}
@keyframes ttlshine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
.ttl.fx-glow{animation:ttlglow 2s ease-in-out infinite}
@keyframes ttlglow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 12px 1px var(--b)}}
.ttl.fx-pulse{animation:ttlpulse 1.6s ease-in-out infinite}
@keyframes ttlpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.tgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.tcard{display:grid;gap:10px;align-content:start}
.tcard .pv{display:grid;gap:8px;justify-items:center;padding:14px 8px;background:#0d0805;border-radius:10px}
.iconpick{display:flex;flex-wrap:wrap;gap:6px}.iconpick button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#0d0805;color:var(--text);cursor:pointer;display:grid;place-items:center}
.iconpick button.on{border-color:var(--gold);background:var(--panel2)}.iconpick svg{width:20px;height:20px}
input[type=color]{width:52px;height:36px;padding:2px;cursor:pointer}
.login{max-width:360px;margin:12vh auto;padding:26px}
.empty{padding:22px;text-align:center;color:var(--muted)}
.navsec{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:#7d6b52;padding:12px 12px 3px;font-weight:700}
.navsec:first-of-type{padding-top:4px}
.qs{margin:0 4px 6px;display:block}.qs input{width:100%;padding:7px 10px;font-size:13px}
.lead{color:var(--muted);font-size:13.5px;max-width:860px;margin:2px 0 6px}
.sec{margin-top:18px}
.sec>h2{margin:0 0 4px}
.sec>.help{color:var(--muted);font-size:12.5px;margin:0 0 10px;max-width:820px}
.fgrid{display:grid;gap:14px 16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.fld{display:grid;gap:4px;align-content:start}
.fld>span.l{font-size:12.5px;color:var(--text);font-weight:600}
.fld>span.h{font-size:11.5px;color:var(--muted);line-height:1.35}
.fld input[type=number],.fld input[type=text],.fld select,.fld textarea{width:100%}
.fld.changed input,.fld.changed select,.fld.changed textarea,.fld.changed .lst input{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.fld .hint{font-size:11.5px;color:var(--gold2);min-height:15px}
.lst{display:grid;gap:6px}
.lst .it{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}
.lst .it b{font-size:11.5px;color:var(--muted);min-width:46px;font-weight:600}
.lst .it input{width:100%}
.lst .it .hint{grid-column:2}
.lst{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.xbtn{background:none;border:1px solid var(--line);border-radius:7px;color:var(--muted);cursor:pointer;width:28px;height:30px}
.xbtn:hover{color:#fff;border-color:var(--bad)}
.savebar{position:sticky;bottom:12px;margin-top:22px;display:flex;align-items:center;gap:12px;justify-content:space-between;background:#2a1c10;border:1px solid var(--gold2);border-radius:12px;padding:10px 14px;box-shadow:0 12px 30px rgba(0,0,0,.55);z-index:20}
.savebar[hidden]{display:none}
.savebar .msg{font-weight:700}
.toggles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0d0805;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tog.off{border-color:var(--bad);background:rgba(212,87,74,.08)}
.tog b{font-size:14px}.tog .sub{font-size:11.5px}
.adrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.adrow span{font-size:12px;padding:4px 9px;border-radius:8px;background:#0d0805;border:1px solid var(--line)}
.adrow span.ad{background:rgba(243,205,98,.14);border-color:var(--gold2);color:var(--gold);font-weight:700}
.livegrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.lt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lt .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lt .seat{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.dot.off{background:#6b5a45}
.tierrow td{padding:5px 8px}
.tierrow select,.tierrow input{padding:4px 6px}
@media (max-width:820px){.app{grid-template-columns:1fr}nav.side{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:8px}nav.side .brand,nav.side .navsec,nav.side .qs{display:none}nav.side a{white-space:nowrap}main{padding:16px}.savebar{bottom:6px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => Number(n || 0).toLocaleString('en');
const short = n => { n = Number(n || 0); const a = Math.abs(n); return a >= 1e9 ? (n / 1e9).toFixed(a >= 1e10 ? 0 : 1) + 'B' : a >= 1e6 ? (n / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M' : a >= 1e3 ? Math.round(n / 1e3) + 'K' : String(n); };
const cairo = new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Cairo', dateStyle: 'medium', timeStyle: 'short' });
const when = t => t ? cairo.format(new Date(t)) : '—';
const ago = t => { if (!t) return '—'; const s = (Date.now() - t) / 1000; return s < 90 ? 'now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const GAMES = { rotate: 'Each week in turn', domino: 'Dominoes', tawla: 'Backgammon (tawla)', chess: 'Chess', ludo: 'Ludo' };
let state = { view: 'overview', catalog: null, pending: 0 };

const ERRS = {
  nobody_signed_up: 'Nobody has signed up for this tournament yet, so it can’t start. Use “Skip this one” to move to the next week.',
  tourney_not_open: 'This tournament has already started or ended. The page is now up to date.',
};
async function api(path, opts = {}) {
  const r = await fetch('/api/admin' + path, { method: opts.method || (opts.body ? 'POST' : 'GET'), headers: { 'Content-Type': 'application/json' }, body: opts.body ? JSON.stringify(opts.body) : undefined, credentials: 'same-origin' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(); throw new Error('Signed out'); }
  if (!r.ok) throw new Error(ERRS[j.error] || j.error || ('HTTP ' + r.status));
  return j;
}
function toast(msg, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 4500 : 2400); }
async function act(fn, ok) { try { const r = await fn(); if (ok) toast(ok); return r; } catch (e) { if (e.message !== 'Signed out') toast(e.message, true); throw e; } }

/* ---------------- titles: drawn the same way as in the game ---------------- */
function iconSvg(name) { const d = (state.catalog?.icons || {})[name]; return d ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="' + d + '"/></svg>' : ''; }
function badge(t, lang, big) {
  if (!t) return '';
  const s = t.style;
  return '<span class="ttl fx-' + esc(s.effect) + (big ? ' big' : '') + '" style="--b:' + esc(s.border) + ';background:linear-gradient(90deg,' + esc(s.bg[0]) + ',' + esc(s.bg[1]) + ');color:' + esc(s.fg) + '"' + (lang === 'ar' ? ' dir="rtl"' : '') + '>' + iconSvg(s.icon) + esc(lang === 'en' ? t.en : t.ar) + '</span>';
}
const titleById = id => (state.catalog?.titles || []).find(t => t.id === id);

/* ---------------- sign in ---------------- */
function showLogin() {
  $('#root').innerHTML = '<div class="card login"><h1>Control room</h1><p class="sub">Board Battles · enter the server\'s ADMIN_KEY</p>' +
    '<form id="lf" class="row" style="display:grid;gap:10px"><input id="lk" type="password" placeholder="Admin key" autocomplete="current-password" required>' +
    '<button class="btn gold">Sign in</button><div id="le" class="sub"></div></form></div>';
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    try { await api('/login', { body: { key: $('#lk').value } }); start(); }
    catch (er) { $('#le').textContent = er.message === 'admin_off' ? 'The dashboard is off: set ADMIN_KEY on the server.' : er.message === 'wrong_key' ? 'Wrong key.' : er.message; }
  };
  $('#lk').focus();
}

/* ---------------- the frame ---------------- */
// the sidebar: [view, label] rows under section headings
const NAV = [
  ['Now', [['overview', 'Overview'], ['live', 'Live tables'], ['analytics', 'Analytics']]],
  ['Players', [['players', 'Players'], ['reports', 'Reports & support'], ['purchases', 'Purchases']]],
  ['Engage', [['rewards', 'Push, gifts & notices'], ['events', 'Events'], ['tourney', 'Tournaments'], ['season', 'Season pass'], ['titles', 'Titles']]],
  ['Game rules', [['games', 'Games & ads'], ['economy', 'Economy'], ['coinprizes', 'Prizes'], ['system', 'System']]],
  ['', [['log', 'Activity log']]],
];
// the old Vodafone Cash money prizes: only listed while they are on or still have claims to settle
const VIEWS = NAV.flatMap(x => x[1]).concat([['prizes', 'Money prizes (Vodafone Cash)']]);
const ALIAS = { settings: 'system' };
function frame() {
  $('#root').innerHTML = '<div class="app"><nav class="side"><div class="brand">♛ Board Battles<small>Control room</small></div>' +
    '<form class="qs" id="qsf"><input id="qsi" placeholder="Find a player…" autocomplete="off"></form>' +
    NAV.map(([h, rows]) => (h ? '<div class="navsec">' + h + '</div>' : '<div style="height:10px"></div>') + rows.map(([k, l]) => '<a href="#' + k + '" data-v="' + k + '">' + l + '</a>').join('')).join('') +
    '<a href="#prizes" data-v="prizes" id="moneynav" hidden>Money prizes<span class="pill" id="pendpill" hidden></span></a>' +
    '<a href="#" id="logout" style="margin-top:14px">Sign out</a></nav><main id="main"></main></div>';
  $('#logout').onclick = async e => { e.preventDefault(); if (!leaveOk()) return; await api('/logout', { body: {} }).catch(() => {}); showLogin(); };
  $('#qsf').onsubmit = e => { e.preventDefault(); state.q = $('#qsi').value.trim(); if (location.hash === '#players') go(); else location.hash = 'players'; };
}
function setPending(n) { state.pending = n; const p = $('#pendpill'); if (p) { p.hidden = !n; p.textContent = n; } const m = $('#moneynav'); if (m) m.hidden = !(n || state.moneyOn); }
// unsaved changes on a settings page: asked before leaving it
let dirtyCheck = null;
const leaveOk = () => !dirtyCheck || !dirtyCheck() || confirm('You have unsaved changes on this page. Leave without saving?');
window.addEventListener('beforeunload', e => { if (dirtyCheck && dirtyCheck()) { e.preventDefault(); e.returnValue = ''; } });
let lastHash = location.hash, liveTimer = null;
async function go() {
  if (location.hash !== lastHash && !leaveOk()) { history.replaceState(null, '', lastHash || '#overview'); return; }
  lastHash = location.hash; dirtyCheck = null;
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  closeDrawer();
  let v = (location.hash.slice(1) || 'overview').split('/')[0];
  v = ALIAS[v] || v;
  state.view = VIEWS.some(x => x[0] === v) ? v : 'overview';
  document.querySelectorAll('nav.side a[data-v]').forEach(a => a.classList.toggle('on', a.dataset.v === state.view));
  const main = $('#main'); main.innerHTML = '<div class="empty">Loading…</div>';
  try { await RENDER[state.view](main); } catch (e) { if (e.message !== 'Signed out') main.innerHTML = '<div class="card">Could not load: ' + esc(e.message) + '</div>'; }
}
async function start() {
  frame();
  try { state.catalog = await api('/catalog'); } catch { return; }
  window.onhashchange = go;
  go();
  const tick = async () => { try { const o = await api('/overview'); state.moneyOn = o.flags.prizes; setPending(o.prizePending); } catch {} };
  tick(); setInterval(tick, 60000);
}

/* ---------------- charts (plain SVG) ---------------- */
function bars(rows, key, label, color) {
  const W = 460, H = 150, P = 14, max = Math.max(1, ...rows.map(r => r[key]));
  const bw = (W - P * 2) / rows.length;
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + (H + 34) + '" role="img" aria-label="' + esc(label) + '">';
  s += '<text x="0" y="14" fill="#b9a88a" font-size="14" font-weight="600">' + esc(label) + ' · last ' + rows.length + ' days</text>';
  rows.forEach((r, i) => {
    const h = Math.round((r[key] / max) * (H - 40)), x = P + i * bw + 3, y = H - h;
    s += '<rect x="' + x + '" y="' + y + '" width="' + (bw - 6) + '" height="' + Math.max(1, h) + '" rx="3" fill="' + color + '"><title>' + esc(r.day) + ': ' + num(r[key]) + '</title></rect>';
    if (r[key]) s += '<text x="' + (x + (bw - 6) / 2) + '" y="' + (y - 4) + '" fill="#f4e6c8" font-size="11" text-anchor="middle">' + short(r[key]) + '</text>';
    if ((i % 3 === 0 && i < rows.length - 2) || i === rows.length - 1) s += '<text x="' + (x + (bw - 6) / 2) + '" y="' + (H + 18) + '" fill="#b9a88a" font-size="11" text-anchor="middle">' + esc(r.day.slice(5)) + '</text>';
  });
  return s + '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + H + '" y2="' + H + '" stroke="#3a2a1e"/></svg>';
}

const RENDER = {};

/* ---------------- overview ---------------- */
RENDER.overview = async main => {
  const o = await api('/overview');
  setPending(o.prizePending);
  const k = (v, l, alert) => '<div class="card kpi' + (alert ? ' alert' : '') + '"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>';
  const f = (on, l, warn) => '<span class="flag ' + (warn && on ? 'warn' : on ? 'on' : 'off') + '">' + l + ': ' + (on ? 'on' : 'off') + '</span>';
  const t = o.tourney;
  main.innerHTML = '<h1>Overview</h1><div class="sub">Cairo time · updated ' + when(Date.now()) + '</div>' +
    '<div class="flags">' + f(o.flags.maintenance, 'Maintenance', true) + f(!!o.flags.notice, 'Notice') + f(t.enabled, 'Tournament') + f(o.flags.season, 'Season pass') + f(o.flags.push, 'Push') +
      '<a class="flag" href="#games" style="text-decoration:none;color:inherit">Ads between games: ' + (o.flags.adEvery ? (o.flags.adEvery === 1 ? 'every game' : '1 in ' + o.flags.adEvery) : 'off') + '</a>' +

/* ---------------- analytics ---------------- */
const MODE_GAME = m => /^(ffa|team)/.test(m) ? 'domino' : /^chess/.test(m) ? 'chess' : /^ludo/.test(m) ? 'ludo' : /^basra/.test(m) ? 'basra' : /^tarneeb/.test(m) ? 'tarneeb' : /^konkan/.test(m) ? 'konkan' : /^estimation/.test(m) ? 'estimation' : 'tawla';
RENDER.analytics = async main => {
  const days = Number((location.hash.split('/')[1])) || 30;
  const d = await api('/analytics?days=' + days);
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  const cell = (n, of, ready) => !ready ? '<td class="num muted">…</td>' : '<td class="num" style="background:rgba(201,162,90,' + (of ? (n / of * 0.8).toFixed(2) : 0) + ')">' + pct(n, of) + '<div class="sub">' + n + '</div></td>';
  // totals over the cohorts that are old enough
  const sum = (k, r) => d.retention.filter(x => x[r]).reduce((a, x) => a + x[k], 0);
  const joinedFor = r => d.retention.filter(x => x[r]).reduce((a, x) => a + x.joined, 0);
  const games = { domino: [0, 0], tawla: [0, 0], chess: [0, 0], ludo: [0, 0], estimation: [0, 0] };
  d.games.online.forEach(r => { const g = games[MODE_GAME(r.mode)]; if (g) g[0] += r.n; });
  d.games.practice.forEach(r => { if (games[r.game]) games[r.game][1] += r.n; });
  const top = Math.max(1, ...d.funnel.map(f => f.n));
  const hmax = Math.max(1, ...d.hours);
  main.innerHTML = '<h1>Analytics</h1><div class="sub">Who comes back, where new players drop off, what is played and when. Cairo time.</div>' +
    '<div class="grid" style="margin-top:12px">' +
      '<div class="card kpi"><div class="v">' + pct(sum('d1', 'd1Ready'), joinedFor('d1Ready')) + '</div><div class="l">Come back the next day (day 1)</div></div>' +
      '<div class="card kpi"><div class="v">' + pct(sum('d3', 'd3Ready'), joinedFor('d3Ready')) + '</div><div class="l">Come back on day 3</div></div>' +
      '<div class="card kpi"><div class="v">' + pct(sum('d7', 'd7Ready'), joinedFor('d7Ready')) + '</div><div class="l">Come back on day 7</div></div>' +
      '<div class="card kpi"><div class="v">' + num(d.retention.reduce((a, x) => a + x.joined, 0)) + '</div><div class="l">New players, last 21 days</div></div>' +
    '</div>' +
    '<h2>New players: where they drop off</h2><div class="tabs">' + [7, 30, 90].map(n => '<button data-days="' + n + '" class="' + (n === d.days ? 'on' : '') + '">Last ' + n + ' days</button>').join('') + '</div>' +
    '<div class="card">' + d.funnel.map((f, i) => '<div style="display:grid;grid-template-columns:260px 1fr 110px;gap:10px;align-items:center;margin:6px 0"><div>' + esc(f.step) + '</div>' +
      '<div style="background:var(--panel2);border-radius:6px;height:22px;overflow:hidden"><div style="height:100%;width:' + (f.n / top * 100).toFixed(1) + '%;background:linear-gradient(90deg,#c9a25a,#f3cd62)"></div></div>' +
      '<div class="num"><b>' + num(f.n) + '</b> <span class="sub">' + (i ? pct(f.n, d.funnel[0].n) : '') + '</span></div></div>').join('') + '</div>' +
    '<h2>Coming back, day by day</h2><div class="sub" style="margin-bottom:8px">Each row: the players who started that day, and how many opened the game again 1, 3 and 7 days later.</div>' +
    '<div class="tablewrap"><table><thead><tr><th>Started</th><th class="num">Players</th><th class="num">Day 1</th><th class="num">Day 3</th><th class="num">Day 7</th></tr></thead><tbody>' +
      d.retention.slice().reverse().map(r => '<tr><td>' + esc(r.day) + '</td><td class="num">' + num(r.joined) + '</td>' + cell(r.d1, r.joined, r.d1Ready) + cell(r.d3, r.joined, r.d3Ready) + cell(r.d7, r.joined, r.d7Ready) + '</tr>').join('') + '</tbody></table></div>' +
    '<h2>What is played (last ' + Math.min(d.days, 30) + ' days)</h2><div class="grid">' + Object.entries(games).map(([g, [on, pr]]) => '<div class="card kpi"><div class="v">' + num(on) + '</div><div class="l">' + GNAME[g] + ' online · ' + num(pr) + ' vs the computer</div></div>').join('') + '</div>' +
    '<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Way to play</th><th class="num">Online games</th></tr></thead><tbody>' + d.games.online.sort((a, b) => b.n - a.n).map(r => '<tr><td>' + esc(r.mode) + '</td><td class="num">' + num(r.n) + '</td></tr>').join('') + '</tbody></table></div>' +
    '<h2>When people play (online games by hour, last 14 days)</h2><div class="card"><svg class="chart" viewBox="0 0 640 160" style="max-height:220px">' +
      d.hours.map((n, h) => { const bh = Math.round(n / hmax * 110), x = 14 + h * 26; return '<rect x="' + x + '" y="' + (130 - bh) + '" width="20" height="' + Math.max(1, bh) + '" rx="3" fill="#c9a25a"><title>' + h + ':00 · ' + n + '</title></rect>' + (h % 3 === 0 ? '<text x="' + (x + 10) + '" y="148" fill="#b9a88a" font-size="11" text-anchor="middle">' + h + '</text>' : ''); }).join('') + '</svg>' +
      '<div class="sub">Busiest hour: ' + d.hours.indexOf(Math.max(...d.hours)) + ':00. A good time for the weekly tournament.</div></div>' +
    '<h2>Players who played, last 30 days</h2><div class="card" style="max-width:760px">' + bars(d.daily, 'active', 'Players who played', '#c9a25a') + '</div>';
  main.querySelectorAll('[data-days]').forEach(b => b.onclick = () => { location.hash = 'analytics/' + b.dataset.days; });
};

    const post = (body, ok) => act(() => api('/players/' + encodeURIComponent(id), { body }), ok).then(render);
    $('#cx', dr).onclick = closeDrawer;
    $('#bc', dr).onclick = () => { const a = Number($('#pc', dr).value); if (!a) return toast('Enter an amount', true); if (Math.abs(a) >= 10000000 && !confirm('That is ' + num(a) + ' coins. Sure?')) return; post({ action: 'coins', amount: a, reason: $('#pr', dr).value }, (a > 0 ? 'Gave ' : 'Took ') + num(Math.abs(a)) + ' coins'); };
    $('#bs', dr).onclick = () => { const k = $('#ps', dr).value; if (k) post({ action: 'skin', skin: k }, 'Skin given'); };
    $('#bp', dr).onclick = () => post({ action: d.season.premium ? 'unpremium' : 'premium' }, 'Season pass updated');
    $('#bsp', dr).onclick = () => post({ action: 'sp', sp: Number($('#psp', dr).value) }, 'Season points set');
    $('#bn', dr).onclick = () => post({ action: 'rename', name: $('#pn', dr).value }, 'Renamed');
    if ($('#bm', dr)) $('#bm', dr).onclick = () => post({ action: 'mute', hours: 24 }, 'Muted for 24 h');
    if ($('#bum', dr)) $('#bum', dr).onclick = () => post({ action: 'unmute' }, 'Unmuted');
    if ($('#bb', dr)) $('#bb', dr).onclick = () => { const why = prompt('Ban ' + u.name + '? Reason (they see it):', ''); if (why !== null) post({ action: 'ban', reason: why }, 'Banned'); };
    if ($('#bub', dr)) $('#bub', dr).onclick = () => post({ action: 'unban' }, 'Unbanned');
    $('#bx', dr).onclick = () => { const t = $('#px', dr).value; if (t) post({ action: 'notify', title: $('#pt', dr).value, text: t }, 'Sent'); };
    $('#bd', dr).onclick = () => { if (prompt('Type DELETE to delete ' + u.name + ' for good') === 'DELETE') act(() => api('/players/' + encodeURIComponent(id), { body: { action: 'delete' } }), 'Deleted').then(() => { closeDrawer(); go(); }); };
    $('#bti', dr).onclick = () => { const k = $('#pti', dr).value; if (k) post({ action: 'title', title: k, days: Number($('#ptd', dr).value) }, 'Title given'); };
    dr.querySelectorAll('[data-untitle]').forEach(a => a.onclick = e => { e.preventDefault(); if (confirm('Take back this title?')) post({ action: 'untitle', title: a.dataset.untitle }, 'Title taken back'); });
    dr.querySelectorAll('[data-unskin]').forEach(a => a.onclick = e => { e.preventDefault(); if (confirm('Take back ' + a.dataset.unskin + '?')) post({ action: 'unskin', skin: a.dataset.unskin }, 'Skin taken back'); });
  };
  try { await render(); } catch (e) { dr.innerHTML = '<button class="btn sm x" onclick="closeDrawer()">Close ✕</button><div class="card">' + esc(e.message) + '</div>'; }
}
function closeDrawer() { document.querySelectorAll('.drawer,.shade').forEach(x => x.remove()); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* ---------------- tournaments ---------------- */
RENDER.tourney = async main => {
  const d = await api('/tourney'), v = d.view, t = d.settings;
  const who = e => e ? esc(e.name) + (e.bot ? ' <span class="muted">(cpu)</span>' : '') : '<span class="muted">—</span>';
  const on = !!t.enabled;
  main.innerHTML = '<h1>Tournaments</h1>' +
    '<div class="card row" style="justify-content:space-between;margin-bottom:12px"><div><b>Tournaments in the game</b><div class="sub">' +
      (on ? 'On: players see the tournament, sign up, and it starts by itself every ' + DAYS[t.weekday] + ' at ' + t.hour + ':00.' : 'Off: hidden in the game and none start. Sign-ups are kept for when you switch it back on.') +
      '</div></div><label class="switch"><input type="checkbox" id="ton"' + (on ? ' checked' : '') + '><b>' + (on ? 'On' : 'Off') + '</b></label></div>' +
    '<div class="card row" style="justify-content:space-between' + (on ? '' : ';opacity:.6') + '"><div><b>' + esc(GAMES[v.game] || v.game) + '</b> · <span class="tag ' + (v.state === 'running' ? 'pending' : '') + '">' + (on || v.state !== 'open' ? v.state : 'off') + '</span> · starts ' + when(v.startsAt) +
      '<div class="sub">' + num(v.count) + (v.state === 'open' ? ' signed up' : ' places in the bracket') + ' · prizes ' + v.prizes.map(short).join(' · ') + '</div></div>' +
      '<div class="row">' + (v.state === 'open' && on ? '<button class="btn gold" id="ts">Start now</button>' : '') + (v.state !== 'done' ? '<button class="btn bad" id="tc">' + (v.state === 'running' ? 'Stop' : 'Skip this one') + '</button>' : '') + '</div></div>' +
    (v.rounds.length ? '<h2>Bracket</h2><div class="bracket">' + v.rounds.map((r, i) => '<div class="round"><div class="sub">' + (i === v.rounds.length - 1 ? 'Final' : i === v.rounds.length - 2 ? 'Semi-finals' : 'Round ' + (i + 1)) + '</div>' +
      r.map(m => '<div class="match"><div class="' + (m.winner === 0 ? 'w' : '') + '">' + who(m.a) + '</div><div class="' + (m.winner === 1 ? 'w' : '') + '">' + who(m.b) + '</div>' + (m.live ? '<div class="sub">playing…</div>' : '') + '</div>').join('') + '</div>').join('') + '</div>' : '') +
    (v.results.length ? '<h2>Results</h2><table><tbody>' + v.results.map(x => '<tr><td>#' + x.place + '</td><td>' + esc(x.name) + '</td><td class="num">' + num(x.coins) + '</td></tr>').join('') + '</tbody></table>' : '') +
    '<h2>Settings</h2><div class="card"><div class="form">' +
      '<label class="f">Day (Cairo)<select id="tw">' + DAYS.map((x, i) => '<option value="' + i + '"' + (i === t.weekday ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></label>' +
      '<label class="f">Hour (0–23, Cairo)<input id="th" type="number" min="0" max="23" value="' + t.hour + '"></label>' +
      '<label class="f">Game<select id="tg">' + Object.entries(GAMES).map(([k, l]) => '<option value="' + k + '"' + (k === t.game ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></label>' +
      t.prizes.map((p, i) => '<label class="f">Prize #' + (i + 1) + (i >= 4 ? ' (5th–8th)' : '') + '<input type="number" min="0" class="tp" value="' + p + '"></label>').join('') +
      '<label class="f">Everyone who played<input id="tpl" type="number" min="0" value="' + t.played + '"></label>' +
    '</div><button class="btn gold" id="tsv" style="margin-top:12px">Save tournament settings</button></div>' +
    '<h2>Signed up (' + d.registered.length + ')</h2>' + (d.registered.length ? '<div class="card">' + d.registered.map(r => '<a href="#players/' + esc(r.id) + '" class="tag" style="margin:2px;text-decoration:none">' + esc(r.name) + (r.online ? ' ●' : '') + '</a>').join('') + '</div>' : '<div class="card empty">Nobody yet</div>') +
    '<h2>Past tournaments</h2>' + (d.history.length ? '<table><thead><tr><th>Date</th><th>Game</th><th class="num">People</th><th>Winner</th><th>2nd</th></tr></thead><tbody>' +
      d.history.map(h => '<tr><td>' + esc(h.event) + '</td><td>' + esc(GAMES[h.game] || h.game) + '</td><td class="num">' + num(h.people) + '</td><td>' + esc(h.results?.[0]?.name || '—') + '</td><td>' + esc(h.results?.[1]?.name || '—') + '</td></tr>').join('') + '</tbody></table>' : '<div class="card empty">None yet</div>');
  if ($('#ts')) $('#ts').onclick = async () => {
    if (!v.count) return toast(ERRS.nobody_signed_up, true);
    if (!confirm('Start the tournament now with ' + v.count + ' player' + (v.count === 1 ? '' : 's') + '? Empty places get computer players.')) return;
    try { await act(() => api('/tourney', { body: { action: 'start' } }), 'Tournament started'); } finally { go(); }
  };
  $('#ton').onchange = async e => {
    const want = e.target.checked;
    if (!want && !confirm('Switch tournaments off? They disappear from the game and none start until you switch them back on.' + (v.state === 'running' ? ' The one running now still plays to the end.' : ''))) { e.target.checked = true; return; }
    try { await act(() => api('/settings', { method: 'PUT', body: { tourney: { enabled: want } } }), want ? 'Tournaments are on' : 'Tournaments are off'); } catch { e.target.checked = !want; return; }
    go();
  };
  if ($('#tc')) $('#tc').onclick = async () => {
    if (!confirm(v.state === 'running' ? 'Stop the running tournament? Nobody is paid, and the next one opens.' : 'Skip this tournament? Its sign-ups are dropped and the next week’s opens.')) return;
    try { await act(() => api('/tourney', { body: { action: 'cancel' } }), v.state === 'running' ? 'Tournament stopped' : 'Skipped: the next tournament is open'); } finally { go(); }
  };
  $('#tsv').onclick = async () => {
    await act(() => api('/settings', { method: 'PUT', body: { tourney: { weekday: Number($('#tw').value), hour: Number($('#th').value), game: $('#tg').value,
      prizes: [...main.querySelectorAll('.tp')].map(i => Number(i.value)), played: Number($('#tpl').value) } } }), 'Tournament settings saved'); go();
  };
};

RENDER.season = async main => {

    '<h2>Price</h2><div class="card"><div class="form"><label class="f">Premium with coins<input id="sc" type="number" value="' + st.passCoins + '"></label>' +

    '<h2>Rewards per tier</h2><div class="sub">Free track: a skin or coins. Premium track: skins only (ads are removed only by the 199 EGP monthly no-ads plan). ★ = only from the season.</div>' +

      st.tiers.map((t, i) => '<tr class="tierrow"><td><b>' + (i + 1) + '</b></td><td>' + cell(t.free, 'free', i) + '</td><td>' + cell(t.prem, 'prem', i) + '</td></tr>').join('') +

/* ---------------- settings pages: one form engine ----------------
 * A page is a list of sections; each field points at a setting by its path ('economy.startCoins'). Changed fields
 * light up, a bar at the bottom counts them and saves only what changed; leaving with changes asks first. */
const getAt = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
const setAt = (o, p, v) => { const ks = p.split('.'); let a = o; ks.slice(0, -1).forEach(k => { a[k] = a[k] ?? {}; a = a[k]; }); a[ks[ks.length - 1]] = v; };
const exact = n => { const a = Math.abs(n), t = (x, d) => String(+x.toFixed(d)); return a >= 1e6 ? t(n / 1e6, 3) + 'M' : a >= 1e3 ? t(n / 1e3, 2) + 'K' : String(n); };
const coinsHint = v => { const n = Number(v); return Number.isFinite(n) && n ? '= ' + exact(n) + ' coins' : ''; };
function fieldHtml(f, v) {
  const id = 'f_' + f.path.replace(/\W/g, '_');
  const head = '<span class="l">' + esc(f.label) + '</span>';
  const help = f.help ? '<span class="h">' + f.help + '</span>' : '';
  const numIn = (val, extra) => '<input type="number" data-num value="' + esc(val) + '"' + (f.min !== undefined ? ' min="' + f.min + '"' : '') + (f.max !== undefined ? ' max="' + f.max + '"' : '') + (f.step ? ' step="' + f.step + '"' : '') + (extra || '') + '>';
  if (f.type === 'bool') return '<div class="fld" data-path="' + f.path + '" data-type="bool">' + head + '<label class="switch"><input type="checkbox"' + (v ? ' checked' : '') + '> ' + esc(f.on || 'On') + '</label>' + help + '</div>';
  if (f.type === 'text') return '<div class="fld" data-path="' + f.path + '" data-type="text"' + (f.wide ? ' style="grid-column:1/-1"' : '') + '>' + head + '<input type="text" value="' + esc(v) + '" maxlength="' + (f.maxlen || 300) + '"' + (f.rtl ? ' dir="auto"' : '') + '>' + help + '</div>';
  if (f.type === 'select') return '<div class="fld" data-path="' + f.path + '" data-type="select">' + head + '<select>' + f.options.map(([k, l]) => '<option value="' + esc(k) + '"' + (String(k) === String(v) ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select>' + help + '</div>';
  if (f.type === 'list') {
    const arr = v || [];
    const item = (x, i) => '<div class="it"><b>' + esc(f.itemLabel ? f.itemLabel(i) : '#' + (i + 1)) + '</b>' + numIn(x) + (f.fixed ? '<span></span>' : '<button type="button" class="xbtn" data-rm title="Remove">✕</button>') + (f.coins ? '<span class="hint"></span>' : '') + '</div>';
    return '<div class="fld" data-path="' + f.path + '" data-type="list"' + (f.coins ? ' data-coins' : '') + ' style="grid-column:1/-1">' + head + help + '<div class="lst' + (arr.length > 3 ? ' wide' : '') + '">' + arr.map(item).join('') + '</div>' +
      (f.fixed ? '' : '<div><button type="button" class="btn sm" data-add' + (f.maxItems && arr.length >= f.maxItems ? ' disabled' : '') + '>+ Add</button></div>') + '</div>';
  }
  // numbers: coins (with a 1.5M preview), seconds, percent, plain
  return '<div class="fld" data-path="' + f.path + '" data-type="num"' + (f.type === 'coins' ? ' data-coins' : '') + '>' + head + numIn(v) + (f.type === 'coins' ? '<span class="hint"></span>' : '') + help + '</div>';
}
function readField(el) {
  const t = el.dataset.type;
  if (t === 'bool') return el.querySelector('input').checked;
  if (t === 'text') return el.querySelector('input').value;
  if (t === 'select') { const v = el.querySelector('select').value; return /^-?\d+$/.test(v) ? Number(v) : v; }
  if (t === 'list') return [...el.querySelectorAll('.lst input')].map(i => Number(i.value));
  return Number(el.querySelector('input').value);
}
/** Draws a settings page into `main` and wires the save bar. `extra(main, values, changed)` adds custom parts. */
async function settingsPage(main, title, lead, sections, opts = {}) {
  const s = await api('/settings');
  const orig = structuredClone(s);
  main.innerHTML = '<h1>' + esc(title) + '</h1><div class="lead">' + lead + '</div>' +
    sections.map(sec => '<div class="sec"><h2>' + esc(sec.title) + '</h2>' + (sec.help ? '<div class="help">' + sec.help + '</div>' : '') +
      '<div class="card">' + (sec.html ? sec.html(s) : '') + (sec.fields && sec.fields.length ? '<div class="fgrid">' + sec.fields.map(f => fieldHtml(f, getAt(s, f.path))).join('') + '</div>' : '') + (sec.after ? sec.after(s) : '') + '</div></div>').join('') +
    (opts.footer ? opts.footer(s) : '') +
    '<div class="savebar" id="sbar" hidden><span><span class="msg" id="smsg"></span> <span class="sub" id="sdet"></span></span><span class="row"><button class="btn" id="sdis">Discard</button><button class="btn gold" id="ssave">Save changes</button></span></div>';
  const fields = [...main.querySelectorAll('.fld[data-path]')];
  const custom = opts.collect || (() => ({}));   // pages with their own controls add their values here
  const current = () => { const v = structuredClone(orig); fields.forEach(el => setAt(v, el.dataset.path, readField(el))); Object.entries(custom()).forEach(([p, x]) => setAt(v, p, x)); return v; };
  const changedPaths = () => {
    const v = current(), out = [];
    fields.forEach(el => { if (JSON.stringify(getAt(v, el.dataset.path)) !== JSON.stringify(getAt(orig, el.dataset.path))) out.push(el.dataset.path); });
    Object.keys(custom()).forEach(p => { if (JSON.stringify(getAt(v, p)) !== JSON.stringify(getAt(orig, p))) out.push(p); });
    return out;
  };
  const labelOf = p => { const el = fields.find(x => x.dataset.path === p); return el ? el.querySelector('.l').textContent : (opts.labels || {})[p] || p; };
  const refresh = () => {
    main.querySelectorAll('.fld[data-coins]').forEach(el => {
      if (el.dataset.type === 'list') el.querySelectorAll('.it').forEach(it => { const h = it.querySelector('.hint'); if (h) h.textContent = coinsHint(it.querySelector('input').value); });
      else el.querySelector('.hint').textContent = coinsHint(el.querySelector('input').value);
    });
    const ch = changedPaths();
    fields.forEach(el => el.classList.toggle('changed', ch.includes(el.dataset.path)));
    $('#sbar').hidden = !ch.length;
    $('#smsg').textContent = ch.length === 1 ? '1 unsaved change' : ch.length + ' unsaved changes';
    $('#sdet').textContent = ch.slice(0, 4).map(labelOf).join(' · ') + (ch.length > 4 ? ' …' : '');
    if (opts.onChange) opts.onChange(current());
  };
  main.addEventListener('input', refresh); main.addEventListener('change', refresh);
  main.querySelectorAll('.fld[data-type=list]').forEach(el => {
    const f = sections.flatMap(x => x.fields || []).find(x => x.path === el.dataset.path);
    el.addEventListener('click', e => {
      if (e.target.matches('[data-rm]')) { if (el.querySelectorAll('.it').length > (f.minItems || 1)) e.target.closest('.it').remove(); renumber(); refresh(); }
      if (e.target.matches('[data-add]')) {
        const items = el.querySelectorAll('.it'), last = items[items.length - 1];
        const it = last.cloneNode(true); it.querySelector('input').value = f.addValue ? f.addValue([...items].map(i => Number(i.querySelector('input').value))) : last.querySelector('input').value;
        el.querySelector('.lst').appendChild(it); renumber(); refresh();
      }
    });
    const renumber = () => { const its = el.querySelectorAll('.it'); its.forEach((it, i) => it.querySelector('b').textContent = f.itemLabel ? f.itemLabel(i) : '#' + (i + 1)); const add = el.querySelector('[data-add]'); if (add) add.disabled = !!(f.maxItems && its.length >= f.maxItems); };
  });
  dirtyCheck = () => changedPaths().length > 0;
  $('#sdis').onclick = () => go.call(null, dirtyCheck = null);
  $('#ssave').onclick = async () => {
    const v = current(), ch = changedPaths(), body = {};
    if (opts.confirm) { const q = opts.confirm(v, orig, ch); if (q && !confirm(q)) return; }
    ch.forEach(p => setAt(body, p, getAt(v, p)));
    const saved = await act(() => api('/settings', { method: 'PUT', body }), 'Saved · the game uses it now');
    dirtyCheck = null;
    // the server checks every value: show what it kept (a value out of range comes back corrected)
    const fixed = ch.filter(p => JSON.stringify(getAt(saved, p)) !== JSON.stringify(getAt(v, p)));
    if (fixed.length) toast('Adjusted to the allowed range: ' + fixed.map(labelOf).join(', '), true);
    go();
  };
  refresh();
  if (opts.after) opts.after(main, s);
}

/* ---------------- live tables ---------------- */
RENDER.live = async main => {
  const MODE = m => { const g = Object.keys(GNAME).find(k => m.startsWith(k)) || (m.startsWith('ffa') || m === 'team' ? 'domino' : m.startsWith('chess') ? 'chess' : ''); return (GNAME[g] || '') + ' · ' + m; };
  const draw = async () => {
    const d = await api('/live');
    if (state.view !== 'live') return;
    const people = d.tables.filter(t => t.seats.some(x => x && !x.bot));
    main.innerHTML = '<h1>Live tables</h1><div class="lead">Refreshes every 5 seconds · ' + num(d.online.length) + ' online · ' + num(d.tables.length) + ' tables (' + num(people.length) + ' with people)' + (d.queued.length ? ' · waiting for a game: ' + d.queued.map(q => esc(q.key) + ' (' + q.players + ')').join(', ') : '') + '</div>' +
      '<div class="tabs" id="lf"><button data-f="people" class="' + (state.liveAll ? '' : 'on') + '">With people</button><button data-f="all" class="' + (state.liveAll ? 'on' : '') + '">All tables</button></div>' +
      ((state.liveAll ? d.tables : people).length ? '<div class="livegrid">' + (state.liveAll ? d.tables : people).map(t => '<div class="lt"><div class="top"><b>' + esc(MODE(t.mode)) + '</b><span class="tag ' + (t.phase === 'play' || t.phase === 'rend' ? 'on' : '') + '">' + esc(t.phase) + '</span></div>' +
        '<div class="sub" style="margin-bottom:6px">' + (t.stake ? 'stake ' + short(t.stake) : t.seats.filter(x => x && !x.bot).length === 1 ? 'practice vs the computer' : 'friendly, no stake') + (t.private && t.seats.filter(x => x && !x.bot).length > 1 ? ' · private room ' + esc(t.code || '') : '') + '</div>' +
        t.seats.map(x => x ? '<div class="seat"><span><span class="dot' + (x.online || x.bot ? '' : ' off') + '"></span>' + (x.bot ? '<span class="muted">' + esc(x.name) + ' (computer)</span>' : '<a href="#players/' + esc(x.uid) + '" data-p="' + esc(x.uid) + '">' + esc(x.name) + '</a>') + '</span></div>' : '<div class="seat muted">empty seat</div>').join('') + '</div>').join('') + '</div>'
        : '<div class="card empty">No tables right now</div>') +
      '<h2>Online now (' + d.online.length + ')</h2>' + (d.online.length ? '<div class="tablewrap"><table><thead><tr><th>Player</th><th class="num">Coins</th><th>Where</th><th></th></tr></thead><tbody>' +
        d.online.sort((a, b) => (b.table ? 1 : 0) - (a.table ? 1 : 0)).map(u => '<tr><td><a href="#players/' + esc(u.uid) + '" data-p="' + esc(u.uid) + '">' + esc(u.name) + '</a></td><td class="num">' + short(u.coins) + '</td><td>' + (u.mode ? esc(MODE(u.mode)) : '<span class="muted">in the café</span>') + '</td>' +
        '<td><button class="btn sm" data-kick="' + esc(u.uid) + '" data-n="' + esc(u.name) + '" title="Closes their connection; the app reconnects by itself">Reconnect</button></td></tr>').join('') + '</tbody></table></div>' : '<div class="card empty">Nobody online</div>');
    main.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { state.liveAll = b.dataset.f === 'all'; draw(); });
    main.querySelectorAll('[data-p]').forEach(a => a.onclick = e => { e.preventDefault(); openPlayer(a.dataset.p); });
    main.querySelectorAll('[data-kick]').forEach(b => b.onclick = async () => { if (confirm('Disconnect ' + b.dataset.n + '? Their app reconnects by itself (it helps when a player is stuck).')) { await act(() => api('/players/' + encodeURIComponent(b.dataset.kick), { body: { action: 'kick' } }), 'Disconnected'); draw(); } });
  };
  await draw();
  liveTimer = setInterval(() => { if (!document.querySelector('.drawer')) draw().catch(() => {}); }, 5000);
};
