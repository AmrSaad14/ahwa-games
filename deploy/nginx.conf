# nginx in front of the game server, for hosts that don't use the Caddy in docker-compose.yml.
# The game server listens on 127.0.0.1:8080 (PORT); set TRUST_PROXY=1 and PUBLIC_URL=https://ahwa-games.a7medhussien.com.
# HTTPS certificate: certbot --nginx -d ahwa-games.a7medhussien.com
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name ahwa-games.a7medhussien.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ahwa-games.a7medhussien.com;
    ssl_certificate     /etc/letsencrypt/live/ahwa-games.a7medhussien.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ahwa-games.a7medhussien.com/privkey.pem;
    client_max_body_size 1m;

    # the live game: a WebSocket that stays open for the whole session
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # everything else: the API, sign-in pages, the web game, the legal pages
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
